<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회사 카드 확인</title>
<style>
/* 확인용 화면: 왼쪽 회사 목록, 오른쪽 카드 + 근거 원문(인용 위치 강조). 외부 파일 없이 열린다. */
:root {
  --bg: #f7f7f9; --panel: #ffffff; --fg: #1d1f24; --muted: #646b78; --line: #e1e3e8;
  --accent: #5b3fd6; --accent-soft: #efebff; --mark: #ffe58a; --warn: #a15c00;
  --font: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: Consolas, "D2Coding", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121318; --panel: #1b1d24; --fg: #e8e9ee; --muted: #9aa0ad; --line: #2c2f39;
  --accent: #a593ff; --accent-soft: #2a2546; --mark: #6b5a12; --warn: #f0b35a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121318; --panel: #1b1d24; --fg: #e8e9ee; --muted: #9aa0ad; --line: #2c2f39;
  --accent: #a593ff; --accent-soft: #2a2546; --mark: #6b5a12; --warn: #f0b35a; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font) }
header { padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline }
header h1 { font-size: 18px; margin: 0 }
header .stat { color: var(--muted); font-size: 13px }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 58px) }
nav { border-right: 1px solid var(--line); background: var(--panel); padding: 8px;
  position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto }
nav button { display: flex; justify-content: space-between; width: 100%; padding: 8px 10px; border: 0;
  background: none; color: var(--fg); font: inherit; text-align: left; border-radius: 6px; cursor: pointer }
nav button:hover { background: var(--bg) }
nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
nav .count { color: var(--muted); font: 12px var(--mono) }
nav button.pending { color: var(--muted) }
nav .wait { font-size: 11px; padding: 0 6px; border: 1px solid var(--line); border-radius: 999px }
main { padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; align-content: start }
.meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font: 12px var(--mono) }
.meta b { color: var(--fg); font: 600 20px var(--font); margin-right: 8px }
section h2 { font-size: 13px; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px }
.item h3 { margin: 0 0 6px; font-size: 15px }
.item blockquote { margin: 0; padding-left: 10px; border-left: 3px solid var(--accent); color: var(--muted); font-size: 14px }
.item .foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted) }
.item .foot a { color: var(--accent) }
.item button { border: 1px solid var(--line); background: none; color: var(--accent); font: 12px var(--font);
  border-radius: 4px; padding: 2px 8px; cursor: pointer }
.empty { color: var(--warn); font-size: 14px; padding: 8px 0 }
.source { grid-column: 1 / -1; background: var(--panel); border: 1px solid var(--line); border-radius: 8px }
.source .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding: 8px 8px 0 }
.source .tabs button { border: 0; background: none; color: var(--muted); font: inherit; padding: 6px 10px; cursor: pointer;
  border-bottom: 2px solid transparent }
.source .tabs button[aria-selected="true"] { color: var(--accent); border-color: var(--accent); font-weight: 600 }
.source pre { margin: 0; padding: 14px; max-height: 420px; overflow: auto; white-space: pre-wrap;
  font: 13px/1.7 var(--font) }
mark { background: var(--mark); color: inherit; border-radius: 2px }
mark.focus { outline: 2px solid var(--accent) }
.notice { padding: 40px 20px; max-width: 60ch }
code { font-family: var(--mono) }
header .add { margin-left: auto; border: 1px solid var(--accent); background: none; color: var(--accent);
  font: 600 13px var(--font); border-radius: 6px; padding: 4px 12px; cursor: pointer }
dialog { width: min(560px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel); color: var(--fg); padding: 20px }
dialog::backdrop { background: rgb(0 0 0 / .4) }
dialog h2 { margin: 0 0 4px; font-size: 17px }
dialog .hint { color: var(--muted); font-size: 13px; margin: 0 0 12px }
dialog label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px }
dialog input, dialog textarea { width: 100%; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px }
dialog textarea { min-height: 90px; resize: vertical }
#found { list-style: none; margin: 6px 0 0; padding: 0; max-height: 220px; overflow: auto }
#found button { width: 100%; display: flex; justify-content: space-between; gap: 8px; text-align: left;
  border: 0; background: none; color: var(--fg); font: inherit; padding: 6px 8px; border-radius: 6px; cursor: pointer }
#found button:hover:not(:disabled) { background: var(--accent-soft) }
#found button:disabled { color: var(--muted); cursor: default }
#found small, #picked small { color: var(--muted); font-family: var(--mono) }
#picked { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px }
.row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px }
.row button, #ask { border: 1px solid var(--line); background: none; color: var(--fg); font: inherit;
  border-radius: 6px; padding: 6px 14px; cursor: pointer }
.row .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600 }
.row .primary:disabled { opacity: .4; cursor: default }
#ask { margin-top: 8px; font-size: 13px; color: var(--accent) }
#msg { font-size: 13px; margin-top: 10px } #msg.ok { color: var(--accent) } #msg.err { color: var(--warn) }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr } nav { border-right: 0; border-bottom: 1px solid var(--line);
  display: flex; overflow-x: auto; gap: 4px; position: static; max-height: none } nav button { width: auto; white-space: nowrap; gap: 8px }
  main { grid-template-columns: 1fr }
}
</style>
</head>
<body>
<header><h1>회사 카드 확인</h1><span class="stat" id="stat"></span><button class="add" id="open-add">+ 회사 추가</button></header>
<div class="layout"><nav id="list" aria-label="회사 목록"></nav><main id="view"></main></div>
<script src="data/viewer_data.js"></script>
<script>
const rows = window.VIEWER_DATA || [];
let current = null; // 지금 보고 있는 회사 행
// 카드 항목과 그 항목의 근거 원문(viewer.py가 넣는 키)
const FIELDS = [["talent", "인재상"], ["direction", "사업 방향"], ["market", "경쟁·시장"], ["recent", "최근 이슈"]];
const SOURCES = { talent: "talent_text", direction: "business_text", market: "market_text", recent: "news_text" };
const count = (r, f) => (r.card[f] ?? []).length;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// 검증(verify.py)과 같은 기준: 띄어쓰기·가운뎃점 모양 차이는 무시하고 원문 속 인용 위치를 찾는다
const DOTS = "ᆞᆆㆍ·‧・•";
function quotePattern(quote) {
  const chars = [...quote.replace(/\s+/g, "")].map((c) =>
    DOTS.includes(c) ? `[${DOTS}]` : c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  return chars.length ? new RegExp(chars.join("\\s*")) : null;
}
function highlight(text, quotes) {
  const ranges = [];
  quotes.forEach((q, i) => {
    const m = quotePattern(q)?.exec(text);
    if (m) ranges.push([m.index, m.index + m[0].length, i]);
  });
  ranges.sort((a, b) => a[0] - b[0]);
  let html = "", at = 0;
  for (const [s, e, i] of ranges) {
    if (s < at) continue;
    html += esc(text.slice(at, s)) + `<mark data-q="${i}">${esc(text.slice(s, e))}</mark>`;
    at = e;
  }
  return html + esc(text.slice(at));
}

if (!rows.length) {
  $("view").innerHTML = `<div class="notice">데이터가 없습니다. <code>ai</code> 폴더에서
    <code>uv run --env-file .env python -m pipeline.run</code>을 실행하면 이 화면이 읽을
    <code>data/viewer_data.js</code>가 만들어집니다.</div>`;
} else {
  const total = (f) => rows.reduce((n, r) => n + count(r, f), 0);
  $("stat").textContent = `회사 ${rows.length}곳 · ` + FIELDS.map(([f, t]) => `${t} ${total(f)}개`).join(" · ");
  $("list").innerHTML = rows.map((r, i) =>
    `<button data-i="${i}"><span>${esc(r.card.name)}</span>
     <span class="count">${FIELDS.map(([f]) => count(r, f)).join("·")}</span></button>`).join("");
  show(0);
}
// 카드가 하나도 없어도 대기 중인 회사는 눌러 볼 수 있게 목록 클릭은 항상 받는다
$("list").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b?.dataset.pending) showPending(b.dataset.pending);
  else if (b) show(+b.dataset.i);
});

// 회사 목록에는 있지만 카드가 아직 없는 회사(방금 추가한 회사 등)를 목록 끝에 "대기"로 붙인다
async function loadPending() {
  let list = [];
  try { list = await (await fetch("/api/companies")).json(); } catch { return; }
  if (!Array.isArray(list)) return;
  const pending = list.filter((c) => !c.has_card).map((c) => c.name);
  document.querySelectorAll("nav button.pending").forEach((b) => b.remove());
  $("list").insertAdjacentHTML("beforeend", pending.map((n) =>
    `<button class="pending" data-pending="${esc(n)}"><span>${esc(n)}</span><span class="wait">대기</span></button>`).join(""));
  const base = $("stat").textContent.replace(/ · 카드 대기 \d+곳$/, "");
  $("stat").textContent = pending.length ? `${base} · 카드 대기 ${pending.length}곳` : base;
}

function showPending(name) {
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-current", b.dataset.pending === name));
  $("view").innerHTML = `<div class="notice"><b>${esc(name)}</b>: 카드 생성 대기 중입니다.<br>
    다음 매일 작업(13:00)이나 Airflow에서 <code>company_news_daily</code>를 실행하면 카드가 만들어집니다.</div>`;
}
loadPending();

function show(i) {
  const r = rows[i], c = r.card;
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-current", b.dataset.i == i));
  const items = (field, title) => {
    const list = c[field] ?? [];
    const body = list.length ? list.map((it, k) => `
      <div class="item"><h3>${esc(it.keyword ?? it.summary)}</h3>
        <blockquote>${esc(it.quote)}</blockquote>
        <div class="foot"><span>${it.published ? esc(it.published) + " · " : ""}${it.articles ? `기사 ${it.articles}건 · ` : ""}${it.source?.startsWith("http")
          ? `<a href="${esc(it.source)}" target="_blank" rel="noopener">출처 페이지</a>` : esc(it.source)}</span>
        <button data-field="${field}" data-k="${k}">원문에서 보기</button></div></div>`).join("")
      : `<div class="empty">${field === "talent" && !r.talent_text ? "인재상 원문 없음"
          : ["direction", "market"].includes(field) && !r.business_text ? "사업보고서 없음 (비상장 등)" : "검증을 통과한 항목 없음"}</div>`;
    return `<section><h2>${title} (${list.length})</h2>${body}</section>`;
  };
  $("view").innerHTML = `
    <div class="meta"><b>${esc(c.name)}</b><span>고유번호 ${esc(c.corp_code)}</span>
      <span>생성 ${esc(c.generated_at)}</span><span>모델 ${esc(c.model)}</span>
      <span>프롬프트 ${esc(c.prompt_version)}</span><span>인재상 수집 ${esc(r.talent_collected_at || "-")}</span></div>
    ${FIELDS.map(([f, t]) => items(f, t)).join("")}
    <div class="source"><div class="tabs" role="tablist">
      ${FIELDS.map(([f, t]) => `<button role="tab" data-tab="${f}">${t} 원문</button>`).join("")}</div>
      <pre id="src"></pre></div>`;
  current = r;
  tab("direction");
}

function tab(field) {
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === field));
  const text = current[SOURCES[field]];
  $("src").innerHTML = text ? highlight(text, (current.card[field] ?? []).map((it) => it.quote)) : "원문 없음";
}
$("view").addEventListener("click", (e) => {
  if (e.target.dataset.tab) return tab(e.target.dataset.tab);
  const b = e.target.closest("button[data-field]");
  if (!b) return;
  tab(b.dataset.field);
  const m = $("src").querySelector(`mark[data-q="${b.dataset.k}"]`);
  if (m) { m.classList.add("focus"); m.scrollIntoView({ block: "center", behavior: "smooth" }); }
});
</script>

<dialog id="add">
  <h2>회사 추가</h2>
  <p class="hint">DART에 등록된 회사만 검색해서 추가한다. 추가하면 다음 매일 작업(13:00)이나 Airflow ▶에서 카드가 만들어진다.</p>
  <label for="q">회사 검색 (한글명·영문명)</label>
  <input id="q" autocomplete="off" placeholder="예: 엘지씨엔에스, LG CNS, 카카오페이">
  <ul id="found"></ul>
  <button id="ask" hidden>검색에 없나요? AI로 정식 회사명 찾기</button>
  <div id="picked" hidden></div>
  <div id="extra" hidden>
    <label for="news_query">기사 검색어 (기사에서 부르는 이름이 다를 때만)</label>
    <input id="news_query" placeholder="예: 삼성SDS">
    <label for="talent_url">인재상 페이지 주소 (공식 채용 페이지)</label>
    <input id="talent_url" placeholder="https://">
    <label for="talent_text">인재상 원문 (페이지 문장 그대로, 비워도 됨)</label>
    <textarea id="talent_text"></textarea>
    <label for="talent_collected_at">인재상 복사한 날짜</label>
    <input id="talent_collected_at" type="date">
  </div>
  <p id="msg" role="status"></p>
  <div class="row"><button id="close-add">닫기</button><button class="primary" id="do-add" disabled>추가</button></div>
</dialog>
<script>
// 회사 추가: viewer.py 서버 API(/api/search·ask·check·add)를 쓴다. 카드 데이터 유무와 상관없이 동작
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const label = (c) => `${c.listed ? "상장" : "비상장"} · ${c.code}`;
  let picked = null, timer = null, serverMode = false;
  const say = (text, cls = "") => { $("msg").textContent = text; $("msg").className = cls; };
  const api = async (path, init) => {
    const res = await fetch(path, init);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `오류 ${res.status}`);
    return body;
  };
  const showFound = (list) => {
    $("found").innerHTML = list.map((c, i) => `<li><button data-i="${i}" ${c.registered ? "disabled" : ""}>
      <span>${esc(c.name)}${c.eng ? ` <small>${esc(c.eng)}</small>` : ""}</span>
      <small>${c.registered ? "이미 등록됨" : esc(label(c))}</small></button></li>`).join("");
    $("found").onclick = (e) => { const b = e.target.closest("button"); if (b) pick(list[+b.dataset.i]); };
  };
  const pick = async (c) => {
    picked = null; $("do-add").disabled = true; $("found").innerHTML = ""; $("ask").hidden = true;
    $("picked").hidden = false; $("picked").innerHTML = `<b>${esc(c.name)}</b> <small>${esc(label(c))}</small><br>사업보고서 확인 중…`;
    try {
      const info = await api(`/api/check?code=${c.code}`);
      const ok = !info.registered;
      $("picked").innerHTML = `<b>${esc(info.name)}</b> <small>${esc(label(info))}</small><br>` +
        (info.registered ? "이미 등록된 회사" : info.report ? "최근 1년 사업보고서 있음 ✓ 전체 카드"
          : "사업보고서 없음 → 인재상·최근 이슈만 있는 부분 카드 (인재상 원문을 꼭 채워 주세요)");
      $("extra").hidden = !ok; $("do-add").disabled = !ok; picked = ok ? info : null;
      for (const f of ["news_query", "talent_url", "talent_text"]) $(f).value = "";
    } catch (err) { say(err.message, "err"); }
  };
  $("q").addEventListener("input", () => {
    clearTimeout(timer); say(""); $("picked").hidden = true; $("extra").hidden = true; $("do-add").disabled = true;
    const q = $("q").value.trim();
    if (!q) { $("found").innerHTML = ""; $("ask").hidden = true; return; }
    timer = setTimeout(async () => {
      try { const list = await api(`/api/search?q=${encodeURIComponent(q)}`); showFound(list); $("ask").hidden = false;
        if (!list.length) say("DART 목록에서 찾지 못함. 약칭이면 아래 AI 찾기를 눌러 보세요"); }
      catch (err) { say(err.message, "err"); }
    }, 250);
  });
  $("ask").addEventListener("click", async () => {
    say("AI에게 정식 회사명을 묻는 중…");
    try { const c = await api(`/api/ask?q=${encodeURIComponent($("q").value.trim())}`);
      if (c) { say("AI가 찾은 회사 (DART 목록에 있는 이름만 보여 줌). 맞는지 확인하세요"); showFound([c]); }
      else say("AI도 찾지 못함. 회사 이름이 바뀌었는지 확인하세요", "err"); }
    catch (err) { say(err.message, "err"); }
  });
  $("do-add").addEventListener("click", async () => {
    if (!picked) return;
    const body = { code: picked.code };
    for (const f of ["news_query", "talent_url", "talent_text", "talent_collected_at"]) body[f] = $(f).value;
    try { const r = await api("/api/add", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      say(`${r.added} 추가됨${r.report ? "" : " (부분 카드)"}. 다음 매일 작업(13:00)이나 Airflow ▶에서 카드가 만들어진다` +
        (serverMode ? "" : ". companies.json 변경은 커밋해야 팀에 반영된다"), "ok");
      loadPending();
      $("do-add").disabled = true; picked = null; }
    catch (err) { say(err.message, "err"); }
  });
  $("open-add").addEventListener("click", () => {
    $("talent_collected_at").value = new Date().toISOString().slice(0, 10);
    $("add").showModal(); $("q").focus();
  });
  $("close-add").addEventListener("click", () => $("add").close());
  // 서버(읽기 전용)에서는 회사 추가를 숨긴다. 회사 목록은 git(companies.json)으로 관리한다
  fetch("/api/mode").then((r) => r.json()).then((m) => {
    if (m.readonly) $("open-add").hidden = true;
    serverMode = !!m.server;
  }).catch(() => {});
})();
</script>
</body>
</html>
