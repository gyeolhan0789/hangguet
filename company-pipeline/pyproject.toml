[project]
name = "a301-company-pipeline"
version = "0.1.0"
description = "회사 카드 파이프라인 (DART·뉴스·인재상 → 회사 카드)"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43",
    "company-taxonomy",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# 배포용 패키지를 만들지 않는 애플리케이션 프로젝트다.
[tool.uv]
package = false

# AI와 함께 사용하는 회사 카드 분류 목록(저장소 최상위 공용 패키지). 시험·검사용 설치이며,
# Airflow 컨테이너는 설치하지 않고 패키지 폴더를 연결해 읽는다(airflow/docker-compose.yaml).
[tool.uv.sources]
company-taxonomy = { path = "../shared", editable = true }

# 검사 규칙은 ai/pyproject.toml과 같게 맞춘다.
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import 정렬, N: Naming, B: bugbear, UP: 최신 문법, SIM: 단순화
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["pipeline", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["boto3"]
ignore_missing_imports = true
