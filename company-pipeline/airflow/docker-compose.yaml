# 회사 카드 파이프라인용 Airflow 3.3 + MinIO(원문 저장소). 로컬과 EC2(CI pipeline-deploy)에서 같은 파일을 쓴다.
# 공식 docker-compose(3.3.2)에서 Celery·Redis·워커·트리거러·Flower를 빼고 LocalExecutor로 줄였다.
# 띄우기: cd company-pipeline/airflow && docker compose up -d  → http://localhost:8080
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-airflow-common: &airflow-common
  image: apache/airflow:3.3.2-python3.13
  logging: *logging
  env_file:
    - ../.env # DART_API_KEY, NAVER_CLIENT_ID/SECRET, LLM_*, CARD_S3_BUCKET·CARD_AWS_* (git 제외)
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # 실행 프로세스를 동시 실행 수만큼 미리 띄운다(하나에 약 150MB). 기본 32개면 약 1GB라 4GB 서버에서
    # 메모리 부족으로 작업이 죽는다. llm 풀이 1이라 실제로 동시에 도는 작업은 1~2개뿐
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: local-only-jwt-secret
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
    # 로컬 전용: 로그인 없이 관리자로 접속 (포트도 127.0.0.1에만 연다)
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # 파이프라인 코드(company-pipeline/pipeline)를 import한다. LLM·임베딩은 .env의 GMS 설정을 그대로 쓴다
    PYTHONPATH: /opt/ai
    # 회사 목록: 배포 때 덮어쓰지 않는 data/ 아래 파일. 확인 화면에서 추가한 회사가 여기에 남는다
    # (처음에는 git의 pipeline/companies.json을 복사해 시작)
    COMPANIES_PATH: &companies-path /opt/ai/pipeline/data/companies.json
    # 원문 저장소 MinIO (로컬 전용 계정)
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: &minio-user local-minio
    S3_SECRET_KEY: &minio-password local-minio-password
    S3_BUCKET: &bucket company-pipeline
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ../pipeline:/opt/ai/pipeline
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  # Airflow 실행 기록용 DB (회사 카드 메인 DB와 별개)
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    logging: *logging

  # 원문 저장소. 공식 minio/minio 이미지 배포가 끝나 MinIO 원본 코드로 만든 Chainguard 이미지를 쓴다
  # (무료는 latest 태그만 있다). 저장소 localhost:9000, 웹 화면 localhost:9001
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: *minio-user
      MINIO_ROOT_PASSWORD: *minio-password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    restart: always
    logging: *logging

  # 처음 한 번: 버킷 생성 (이미 있으면 그대로)
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    command: ["mb", "--ignore-existing", "local/company-pipeline"]
    environment:
      MC_HOST_local: http://local-minio:local-minio-password@minio:9000
    depends_on:
      - minio
    restart: on-failure  # MinIO가 아직 준비 전이면 다시 시도
    logging: *logging

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # LocalExecutor라 작업도 스케줄러 안에서 돈다
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # 카드 확인 화면. 매일 작업(write_viewer)이 갱신한 data/viewer_data.js를 보여 주고, 회사 추가도 된다.
  # 회사 검색·AI 찾기가 DART·GMS 키를 써서 .env를 넘긴다. 바깥 공개는 Cloudflare Tunnel + Access로만 한다
  viewer:
    image: apache/airflow:3.3.2-python3.13
    entrypoint: ["python", "-m", "pipeline.viewer"]
    env_file:
      - ../.env
    environment:
      PYTHONPATH: /opt/ai
      VIEWER_HOST: 0.0.0.0
      COMPANIES_PATH: *companies-path
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: *minio-user
      S3_SECRET_KEY: *minio-password
      S3_BUCKET: *bucket
    volumes:
      - ../pipeline:/opt/ai/pipeline
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: always
    logging: *logging

  # 처음 한 번: 실행 기록 DB 테이블 생성, LLM·임베딩 호출 줄 세우기용 풀(크기 1) 생성
  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow pools set llm 1 'LLM·임베딩 호출 작업은 한 번에 하나 (네이버 API 429 방지 포함)'"]
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"

volumes:
  postgres-db-volume:
  minio-data:
