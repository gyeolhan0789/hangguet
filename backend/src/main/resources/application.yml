# 접속 정보는 환경 변수로 주입한다. 기본값은 루트 docker-compose.yml 기준이다.
server:
  # 리버스 프록시(배포: /be 경로) 뒤에서 X-Forwarded-*(Prefix 포함) 헤더를 반영한다.
  # Swagger 문서와 "Try it out"이 프록시 주소(https, /be 접두사)를 쓰게 된다.
  forward-headers-strategy: framework

spring:
  application:
    name: a301
  jackson:
    # 일시는 한국 시간 오프셋(+09:00)으로 내보낸다(목 서버와 같음)
    time-zone: Asia/Seoul
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/a301}
    username: ${DB_USERNAME:a301}
    password: ${DB_PASSWORD:a301-local}
  jpa:
    open-in-view: false
    hibernate:
      # 테이블은 Flyway Migration(src/main/resources/db/migration)으로만 만든다.
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 전체 상태(UP/DOWN)에 DB 연결 상태가 포함된다. 세부 정보는 노출하지 않는다.
      show-details: never

auth:
  jwt-secret: ${JWT_SECRET}
  access-ttl: 9h
  refresh-ttl: 30d

soniox:
  api-key: ${SONIOX_API_KEY:}

elevenlabs:
  api-key: ${ELEVENLABS_API_KEY:}

# 커밋 직후 큐(ai:jobs)에 넣지 못한 AI 작업을 다시 보내는 주기
ai-job:
  republish-interval: 5s

# 자격 증명은 AWS 기본 공급자(AWS_ACCESS_KEY_ID·AWS_SECRET_ACCESS_KEY 환경 변수 등)에서 읽는다.
storage:
  s3:
    bucket: ${S3_BUCKET:a301-local}
    region: ${AWS_REGION:ap-northeast-2}
    upload-url-ttl: 10m
    download-url-ttl: 1h

springdoc:
  swagger-ui:
    path: /docs
