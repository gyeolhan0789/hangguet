# 접속 정보는 환경 변수로 주입한다. 기본값은 루트 docker-compose.yml 기준이다.
server:
  # 리버스 프록시(배포: /be 경로) 뒤에서 X-Forwarded-*(Prefix 포함) 헤더를 반영한다.
  # Swagger 문서와 "Try it out"이 프록시 주소(https, /be 접두사)를 쓰게 된다.
  forward-headers-strategy: framework

spring:
  application:
    name: a301
  task:
    scheduling:
      pool:
        # 주기 작업이 서로 기다리지 않게 한다(기본 1개). 연습 알림의 카카오 호출이 길어져도 AI 작업 재발행(5초마다)이 밀리지 않는다
        size: 4
  jackson:
    # 일시는 한국 시간 오프셋(+09:00)으로 내보낸다(목 서버와 같음)
    time-zone: Asia/Seoul
    deserialization:
      # Optional 필드를 JSON에서 빼면 null, null을 보내면 Optional.empty()로 읽는다(Jackson 3 기본은 둘 다 empty).
      # 8.6 공지 수정이 endsAt을 보내지 않음(그대로)과 null(지움)으로 구분하는 데 쓴다
      USE_NULL_FOR_MISSING_REFERENCE_VALUES: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/a301}
    username: ${DB_USERNAME:a301}
    password: ${DB_PASSWORD:a301-local}
  # 비밀번호 찾기(1.8) 메일. 계정 · 앱 비밀번호는 환경 변수로만 받는다. 계정이 없으면 메일을 보내지 않고 경고만 남긴다
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      # 테이블은 Flyway Migration(src/main/resources/db/migration)으로만 만든다.
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 전체 상태(UP/DOWN)에 DB 연결 상태가 포함된다. 세부 정보는 노출하지 않는다.
      show-details: never
  health:
    mail:
      # 메일 서버(Gmail) 연결을 상태 확인에 넣지 않는다. 메일이 안 돼도 서비스는 살아 있고, 배포 상태 확인이 외부 SMTP에 달리지 않게 한다
      enabled: false

auth:
  jwt-secret: ${JWT_SECRET}
  access-ttl: 9h
  refresh-ttl: 30d

# 비밀번호 찾기(API 명세 1.8 · 1.9)
password-reset:
  # 재설정 링크 유효 시간(한 번만 쓸 수 있음)
  token-ttl: 30m
  # 같은 이메일로 다시 요청할 수 있는 간격. 그 안의 요청은 메일을 보내지 않는다
  resend-interval: 30s
  # 메일 링크가 여는 FE 화면. 뒤에 ?token=을 붙인다
  link-url: ${PASSWORD_RESET_URL:http://localhost:3000/password-reset}
  # 보내는 사람(Gmail 계정과 같게). 비어 있으면 메일을 보내지 않는다
  mail-from: ${MAIL_USERNAME:}

# 소셜 로그인(API 명세 1.6 · 1.7). 키는 환경 변수로만 받는다. 클라이언트 id가 없으면 그 로그인은 503 SOCIAL_LOGIN_UNAVAILABLE
oauth:
  # 처음 로그인한 사람이 약관에 동의(1.7)할 때까지 가입 정보를 맡아 두는 시간
  signup-token-ttl: 10m
  # 제공자 서버 연결·응답 최대 시간. 넘으면 503 SOCIAL_LOGIN_UNAVAILABLE
  timeout: 5s
  kakao:
    # 카카오 앱 REST API 키와 클라이언트 시크릿(카카오 로그인 > 보안에서 켰을 때만)
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    # 받을 수 있는 redirectUri(쉼표로 구분). FE 콜백 주소이며 카카오 앱 Redirect URI에도 등록해야 한다
    redirect-uris: ${KAKAO_REDIRECT_URIS:}
  google:
    # 구글 OAuth 클라이언트 ID와 보안 비밀번호(웹 애플리케이션). 둘 다 있어야 한다
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # 받을 수 있는 redirectUri(쉼표로 구분). FE 콜백 주소이며 구글 클라이언트의 승인된 리디렉션 URI에도 등록해야 한다
    redirect-uris: ${GOOGLE_REDIRECT_URIS:}

# 관리 페이지 관리자 계정. 셋 다 있고 같은 아이디가 없으면 기동할 때 만든다(가입 API 없음)
admin:
  bootstrap:
    login-id: ${ADMIN_LOGIN_ID:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:}

# 문의 제목 · 본문 암호화 키(AES-256). Base64로 인코딩한 32바이트. 없으면 기동하지 않는다(BE 설계 9장)
inquiry:
  encryption-key: ${INQUIRY_ENCRYPTION_KEY}

# 면접방(LiveKit, BE 설계 5.6). 주소·키는 환경 변수로만 받는다. 이름은 배포 계획 7장(LiveKit SDK 기본 이름)과 같다
livekit:
  # 브라우저에 알려 줄 주소(입장 정보 url). 없으면 서버 주소.
  # 이름을 url로 두지 않는다. Spring이 환경 변수 LIVEKIT_URL을 livekit.url로 읽어 이 값을 덮어쓰기 때문이다
  public-url: ${LIVEKIT_PUBLIC_URL:${LIVEKIT_URL:}}
  # BE가 서버 API를 부르는 주소. 운영은 내부 주소(ws://a301-prod-livekit:7880)
  api-url: ${LIVEKIT_URL:}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}
  agent-name: a301-interviewer
  # 입장 토큰 유효 시간(API 명세 5.14). 재접속은 5.14로 다시 받는다
  token-ttl: 10m
  # 녹화 원본을 올릴 S3. 키가 없으면 Egress 서버 설정의 저장소를 쓴다(셀프 호스팅)
  egress-s3:
    access-key: ${LIVEKIT_EGRESS_S3_ACCESS_KEY:}
    secret: ${LIVEKIT_EGRESS_S3_SECRET:}
    bucket: ${S3_BUCKET:a301-local}
    region: ${AWS_REGION:ap-northeast-2}

# 화상 면접 동시 진행 상한(BE 설계 5.2). 넘으면 5.4 · 10.7이 503 INTERVIEW_CAPACITY_FULL
interview:
  capacity:
    # Soniox 실시간 인식 연결 한도(계정당 10개)를 개발 · 운영이 나눠 쓴다. 운영 8, 개발 2로 둔다
    max-video: ${INTERVIEW_MAX_VIDEO:8}
    # 이 시간 안에 시작한 면접만 센다. 화면을 닫고 떠난 면접이 IN_PROGRESS로 남아 자리를 계속 차지하지 않게 한다.
    # 가장 긴 화상 면접(그룹 3명 약 60분, docs/그룹면접-설계.md)보다 길게 둔다
    count-window: 90m
  # 개인 면접 시작 뒤 면접관이 첫 질문을 시작하는지 확인한다(AI 명세 6.5). 못 하면 면접방을 닫고 START_FAILED로 바꾼다. 모두 임시 값이다
  start-watch:
    # 확인 주기
    interval: 5s
    # 시작 뒤 이 시간이 지나도 면접방에 면접관이 없으면 실패. LiveKit이 배정에 응답할 에이전트를 기다리는 10초에 입장 여유를 더했다
    interviewer-timeout: 15s
    # 지원자가 입장한 뒤 이 시간이 지나도 첫 질문이 없으면 실패
    first-question-timeout: 30s
  # 개인 화상 면접의 첫 질문 뒤 이 시간이 지나면 트랙 녹화가 모두 시작됐는지 확인하고, 빠진 트랙만 녹화를 다시 요청한다. 임시 값이다
  recording-check:
    # 트랙이 올라온 직후에는 자동 녹화가 아직 시작 중이라 목록에 없을 수 있어 조금 기다린다
    delay: 10s

# 같은 Idempotency-Key 요청이 처리 중일 때 끝나기를 기다리는 최대 시간. 넘으면 409 IDEMPOTENCY_KEY_REUSED
idempotency:
  # 같은 요청이 처리 중이면 기다리는 최대 시간. 5.4 · 10.7이 면접방을 여는 최대 시간(15초)보다 길게 둔다.
  # 짧으면 처리 중인데 409를 받은 화면이 새 키로 다시 보낸다
  wait-timeout: 20s

# 커밋 직후 큐(ai:jobs)에 넣지 못한 AI 작업을 다시 보내는 주기
ai-job:
  republish-interval: 5s
  # 플랜 생성 최대 대기 시간. 넘으면 5.2 조회 때 FAILED로 바꾼다(B-11 임시 값)
  plan-timeout: 3m
  # 결과 생성 최대 대기 시간. 넘으면 5.2 조회 때 면접을 FAILED로 바꾼다(B-11 임시 값)
  analysis-timeout: 10m

# AI 결과 큐(ai:results) 처리. 저장하지 못한 메시지를 다시 처리할 때까지 기다리는 시간
ai-result:
  consumer-enabled: true
  retry-delay: 5s

# 그룹 면접(docs/그룹면접-설계.md). 모두 임시 값이다
group:
  # 대기 중인 그룹을 만든 지 이 시간이 지나면 조회 때 취소한다
  waiting-expiry: 1h
  # 방장이 대기실 조회(10.4)를 이 시간 넘게 멈추면 다른 참가자의 조회 때 방장을 넘긴다
  lobby-host-timeout: 10s
  # 차례를 정한 뒤 에이전트가 이 시간 안에 질문을 시작하지 않으면 정체로 본다(docs/그룹면접-설계.md 5.2, 임시 값)
  asking-timeout: 20s
  # 질문 음성 길이(speechMs)를 받지 못했을 때 쓰는 값과, 음성이 끝났다는 메시지를 기다리는 여유(6.4)
  default-speech: 60s
  speaking-grace: 5s
  # 답변 시간(6.6). 화상은 마감 뒤 에이전트의 자동 제출을 기다리는 여유를 둔다
  answer-time:
    video: 2m
    chat: 5m
  video-answer-grace: 5s
  # 10.8 답변 시간 연장. 남은 시간이 extend-window 이하일 때 한 번 extend-time만큼 늘린다
  extend-time: 1m
  extend-window: 30s
  # 꼬리질문 판단을 기다리는 시간(결정 값). 측정 뒤 2~3초로 줄일지 본다(6.4)
  followup-decision-timeout: 7s
  # 안전장치(docs/그룹면접-설계.md 6.11). 시작한 지 화상 · 채팅 상한이 지났고 마지막 진행 뒤 멈춘 시간이 지난 그룹의 남은 세션을 끝낸다
  cleanup:
    interval: 1m
    video-limit: 60m
    chat-limit: 100m
    stall-limit: 5m

# 회사 카드 적재(docs/ERD-회사카드.md). 파이프라인이 카드를 올리는 공용 버킷(개발·운영 같은 버킷)의 manifest를 매시 정각에 확인한다.
# 버킷이 없으면(로컬·테스트) 적재하지 않는다. 읽기는 storage.s3와 같은 앱 키·리전을 쓴다
company-card:
  bucket: ${COMPANY_S3_BUCKET:}
  # 최신이 아닌 카드는 이 기간이 지나고 어느 면접도 쓰지 않으면 지운다
  keep: 30d

# 자격 증명은 AWS 기본 공급자(AWS_ACCESS_KEY_ID·AWS_SECRET_ACCESS_KEY 환경 변수 등)에서 읽는다.
storage:
  s3:
    bucket: ${S3_BUCKET:a301-local}
    region: ${AWS_REGION:ap-northeast-2}
    upload-url-ttl: 10m
    download-url-ttl: 1h

springdoc:
  swagger-ui:
    path: /docs
