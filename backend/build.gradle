plugins {
    id 'java'
    id 'checkstyle'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.4'
    // SonarQube 분석. 서버 주소·토큰·프로젝트 키는 CI(.gitlab-ci.yml)에서 넘긴다.
    id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.ssafy'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    // 프로필 사진·답변 음성·녹화 파일(S3 Presigned URL)
    implementation platform('software.amazon.awssdk:bom:2.55.10')
    implementation 'software.amazon.awssdk:s3'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    environment 'JWT_SECRET', 'test-only-signing-secret-at-least-32-bytes'
    finalizedBy tasks.named('jacocoTestReport')
}

// Format: google-java-format AOSP 스타일 (들여쓰기 4칸)
// 1.37.0부터 JDK 21에서 실행되지 않아 1.36.1로 고정한다.
// 검사: ./gradlew spotlessCheck, 자동 수정: ./gradlew spotlessApply
spotless {
    java {
        googleJavaFormat('1.36.1').aosp().reflowLongStrings()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target '*.gradle'
        trimTrailingWhitespace()
        leadingTabsToSpaces(4)
        endWithNewline()
    }
}

// Static Analysis: Formatter가 다루지 않는 Naming·Import·Coding 규칙만 검사한다.
checkstyle {
    toolVersion = '14.3.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
    maxWarnings = 0
}

// SonarQube가 읽을 커버리지 리포트 (build/reports/jacoco/test/jacocoTestReport.xml)
jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

// 실제 PostgreSQL·Redis가 필요한 인증 통합 검사는 명시적으로 실행한다.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'redis-integration'
    }
}

tasks.register('redisIntegrationTest', Test) {
    description = '실행 중인 PostgreSQL·Redis로 인증 HTTP 통합 테스트를 실행한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'redis-integration'
    }
}
