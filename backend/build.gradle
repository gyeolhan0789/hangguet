plugins {
    id 'java'
    id 'checkstyle'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.4'
    // SonarQube 분석. 서버 주소·토큰·프로젝트 키는 CI(.gitlab-ci.yml)에서 넘긴다.
    id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.ssafy'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 비밀번호 찾기(1.8) 재설정 링크 메일(Gmail SMTP)
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    // 프로필 사진·답변 음성·녹화 파일(S3 Presigned URL)
    implementation platform('software.amazon.awssdk:bom:2.55.10')
    implementation 'software.amazon.awssdk:s3'
    // 면접방(LiveKit) 서버 API. 운영 LiveKit 서버(v1.13.10)보다 먼저 나온 버전
    implementation 'io.livekit:livekit-server:0.16.0'
    // 방을 만들 때 트랙 자동 녹화를 함께 켜려고 서버 API를 직접 부른다(SDK의 createRoom은 녹화 설정을 받지 않음). SDK와 같은 버전
    implementation 'com.squareup.retrofit2:converter-protobuf:3.0.0'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // FE가 만든 Pact 계약을 실제 BE로 검증한다(contractTest)
    testImplementation 'au.com.dius.pact.provider:junit5:4.7.6'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    environment 'JWT_SECRET', 'test-only-signing-secret-at-least-32-bytes'
    // 테스트 전용 문의 암호화 키(32바이트를 Base64로)
    environment 'INQUIRY_ENCRYPTION_KEY', 'dGVzdC1vbmx5LWlucXVpcnkta2V5LTMyLWJ5dGVzISE='
    // 테스트 중 AI 작업 재발행이 다른 테스트의 Outbox 행을 실제 Redis로 보내지 않게 사실상 끈다
    systemProperty 'ai-job.republish-interval', '1h'
    // 테스트 중 결과 큐 처리기가 실제 Redis의 ai:results를 꺼내 가지 않게 끈다
    systemProperty 'ai-result.consumer-enabled', 'false'
    // 테스트 중 면접관 확인이 다른 테스트의 진행 중 면접을 시작 실패로 바꾸지 않게 사실상 끈다
    systemProperty 'interview.start-watch.interval', '1h'
    // 테스트 중 그룹 마감 처리기 · 안전장치가 다른 테스트의 진행 중 그룹을 바꾸지 않게 사실상 끈다(테스트는 직접 부른다)
    systemProperty 'group.deadline.interval', '1h'
    systemProperty 'group.cleanup.interval', '1h'
}

// Format: google-java-format AOSP 스타일 (들여쓰기 4칸)
// 1.37.0부터 JDK 21에서 실행되지 않아 1.36.1로 고정한다.
// 검사: ./gradlew spotlessCheck, 자동 수정: ./gradlew spotlessApply
spotless {
    java {
        googleJavaFormat('1.36.1').aosp().reflowLongStrings()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target '*.gradle'
        trimTrailingWhitespace()
        leadingTabsToSpaces(4)
        endWithNewline()
    }
}

// Static Analysis: Formatter가 다루지 않는 Naming·Import·Coding 규칙만 검사한다.
checkstyle {
    toolVersion = '14.3.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
    maxWarnings = 0
}

// SonarQube가 읽을 커버리지 리포트 (build/reports/jacoco/test/jacocoTestReport.xml)
jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

// 실제 PostgreSQL·Redis가 필요한 인증 통합 검사와 Pact 계약 검증은 명시적으로 실행한다.
// 커버리지 리포트는 단위 테스트에만 건다. 모든 Test 태스크에 걸면 다른 Test 태스크만 돌려도 test 전체가 같이 돈다.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'redis-integration', 'contract'
    }
    finalizedBy tasks.named('jacocoTestReport')
}

// FE가 만든 계약 파일(frontend/pacts)을 실제 BE로 검증한다. 계약 파일을 입력으로 선언해,
// 계약이 바뀌면 Gradle 빌드 캐시의 이전 결과를 쓰지 않고 다시 검증한다.
tasks.register('contractTest', Test) {
    description = 'FE Pact 계약을 실행 중인 PostgreSQL·Redis로 띄운 BE에 검증한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'contract'
    }
    inputs.dir(file('../frontend/pacts')).withPropertyName('pacts').withPathSensitivity(PathSensitivity.RELATIVE)
}

tasks.register('redisIntegrationTest', Test) {
    description = '실행 중인 PostgreSQL·Redis로 인증 HTTP 통합 테스트를 실행한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'redis-integration'
    }
}
