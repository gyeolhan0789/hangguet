# 로컬 개발용 인프라
# 앱(backend, frontend, ai)은 IDE나 터미널에서 실행한다.
# 실행: docker compose up -d
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: a301-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-a301}
      POSTGRES_USER: ${POSTGRES_USER:-a301}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-a301-local}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 이미지는 데이터를 /var/lib/postgresql/<버전>/docker에 저장한다.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
