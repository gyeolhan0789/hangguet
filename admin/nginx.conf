server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    location = /admin {
        return 308 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        return 404;
    }
}
