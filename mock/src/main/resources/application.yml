server:
  # 리버스 프록시(예: /mock 경로) 뒤에서 X-Forwarded-* 헤더를 반영한다.
  # Swagger "Try it out"이 프록시 주소로 요청을 보내게 된다.
  forward-headers-strategy: framework

spring:
  application:
    name: a301-mock
  jackson:
    # 일시는 한국 시간 오프셋(+09:00)으로 내보낸다
    time-zone: Asia/Seoul
  mvc:
    # 오류 응답을 RFC 9457 ProblemDetail로
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    doc-expansion: none
  api-docs:
    path: /v3/api-docs

mock:
  cors:
    # FE 주소. 쉼표로 여러 개. 배포 시 MOCK_CORS_ALLOWED_ORIGINS로 바꾼다
    allowed-origins: ${MOCK_CORS_ALLOWED_ORIGINS:http://localhost:3000}
