# 목 서버 미니PC 배포
# CI(mock-deploy)가 실행한다. 수동 실행: 레포 루트에서
#   docker compose -f deploy/mock/compose.yml up -d --build
# 외부 요청 경로: Cloudflare Tunnel → Nginx 컨테이너(nginx.conf.example) → a301-mock:8080 (server_public-network)
name: a301-mock

services:
  mock:
    build:
      context: ../../mock
    image: a301-mock:${MOCK_IMAGE_TAG:-local}
    # Nginx가 이 이름(a301-mock)으로 찾아온다
    container_name: a301-mock
    restart: unless-stopped
    ports:
      # 외부 요청은 Docker 네트워크로 들어온다. 이 포트는 CI 헬스체크용이라 루프백에만 연다.
      - "127.0.0.1:${MOCK_HOST_PORT:-18080}:8080"
    environment:
      # FE 주소. 쉼표로 여러 개. FE 배포 주소가 생기면 GitLab CI/CD Variables로 넘긴다
      MOCK_CORS_ALLOWED_ORIGINS: ${MOCK_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # 미니PC의 다른 서비스와 메모리를 나눠 쓰므로 힙을 제한한다
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    networks:
      - mock-proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # 미니PC의 Nginx 컨테이너가 붙어 있는 네트워크. 미니PC에서 미리 만들어 둔 것을 쓴다
  mock-proxy:
    external: true
    name: server_public-network
