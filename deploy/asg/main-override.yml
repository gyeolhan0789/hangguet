# 메인 서버 전환용 compose 덮어쓰기(이해준/agent_autoscale_plan 10.1의 5 · 10). 지금은 어디에서도 쓰지 않는다.
# 전환하는 날 deploy/prod/compose.yml 뒤에 더한다. 먼저 redis-password.yml을 적용해 Redis 비밀번호를 켠 상태여야 한다
# (Redis를 Tailscale 쪽에 열기 때문이다, 계획 5.2).
#   docker compose -f compose.yml -f redis-password.yml -f main-override.yml up -d
# 필요한 값: MAIN_TAILSCALE_IP(메인 서버의 Tailscale IP, `tailscale ip -4`)
#
# 하는 일
# - 에이전트 · Egress를 메인 서버에서 끈다. 프로필로 꺼 두므로 되돌릴 때는
#   `--profile agent-on-main --profile egress-on-main`으로 다시 켠다(계획 10.1 되돌리기)
# - ASG 인스턴스가 붙는 포트를 Tailscale IP에만 연다: LiveKit 7880, Redis 6379, Prometheus 9090(원격 쓰기), Loki 3100
#   Docker가 연 포트는 ufw를 거치지 않으므로 0.0.0.0에 열리지 않았는지 `ss -tulpn`으로 확인한다(계획 5.4)
# - Prometheus가 원격 쓰기를 받게 한다(ASG 인스턴스의 Alloy가 보낸다, 계획 8장)
#
# 함께 바꿀 것(이 파일 밖): deploy/prod/prometheus.yml의 a301-ai-agent · a301-egress 수집 작업은 지운다.
# 같은 job 이름으로 원격 쓰기가 들어오고, 컨테이너가 없어 수집이 계속 실패하기 때문이다.
# 재부팅 때 Docker가 Tailscale IP에 포트를 묶으려면 tailscaled가 먼저 떠야 한다(systemd After= 또는 net.ipv4.ip_nonlocal_bind=1, 계획 5.4)

services:
  a301-prod-ai-agent:
    profiles: ["agent-on-main"]

  a301-prod-egress:
    profiles: ["egress-on-main"]

  a301-prod-livekit:
    ports:
      - "${MAIN_TAILSCALE_IP:?MAIN_TAILSCALE_IP(메인 서버 Tailscale IP)가 필요하다}:7880:7880"

  a301-prod-redis:
    ports:
      - "${MAIN_TAILSCALE_IP:?MAIN_TAILSCALE_IP(메인 서버 Tailscale IP)가 필요하다}:6379:6379"

  a301-prod-prometheus:
    # command는 덮어쓰면 전부 바뀌므로 compose.yml의 값을 그대로 옮기고 원격 쓰기 받기만 더한다
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-remote-write-receiver
    ports:
      - "${MAIN_TAILSCALE_IP:?MAIN_TAILSCALE_IP(메인 서버 Tailscale IP)가 필요하다}:9090:9090"

  a301-prod-loki:
    ports:
      - "${MAIN_TAILSCALE_IP:?MAIN_TAILSCALE_IP(메인 서버 Tailscale IP)가 필요하다}:3100:3100"
