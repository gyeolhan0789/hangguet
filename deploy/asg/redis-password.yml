# Redis 비밀번호를 켜는 compose 덮어쓰기(이해준/agent_autoscale_plan 5.2 · 10.1의 2). 운영에는 아직 쓰지 않는다.
# ASG 전환 전에 메인 서버에 먼저 적용한다. deploy/prod/compose.yml 뒤에 더한다.
#   docker compose -f compose.yml -f redis-password.yml up -d
# 테스트 서버는 compose.loadtest.yml 뒤에 더한다(loadtest/agent/README.md 「운영 경로 재현」). Egress 설정 본문이 이 파일 것으로 바뀐다
# 필요한 값: REDIS_PASSWORD(GitLab CI/CD 변수, 범위 prod/*). 공백 · 따옴표 없는 무작위 문자열로 만든다
# (ASG 감시 스크립트가 인라인 명령으로 보내고, Egress 설정이 한 줄 JSON이기 때문이다)
#
# 앞서 들어가 있어야 하는 것: AI가 REDIS_PASSWORD를 읽는 코드(S15P31A301-404). 없으면 AI 컨테이너가 Redis에 붙지 못한다.
# BE는 Spring 자동 설정이라 SPRING_DATA_REDIS_PASSWORD만 넣으면 된다.
# ASG 인스턴스는 같은 값을 SSM(/a301/prod/agent/redis-password · /a301/prod/egress/redis-password)에서 읽는다.
#
# LiveKit 서버는 환경 변수 REDIS_PASSWORD를 읽어 livekit.yaml의 redis.password를 덮어쓴다(livekit-server v1.13.10
# cmd/server/main.go의 redis-password 플래그 · pkg/config/config.go, 11/06 소스 확인). 실제 접속은 테스트 서버에서 확인한다

x-redis-password: &redis-password ${REDIS_PASSWORD:?REDIS_PASSWORD CI/CD variable is required}

# AI 작업자 헬스체크도 Redis에 붙으므로 비밀번호를 넘긴다. 나머지 값은 compose.yml과 같다
x-ai-worker-healthcheck: &ai-worker-healthcheck
  test:
    - CMD
    - python
    - -c
    - "import os, redis; redis.Redis(host=os.environ['REDIS_HOST'], port=int(os.environ['REDIS_PORT']), password=os.environ.get('REDIS_PASSWORD') or None, socket_timeout=3).ping()"
  interval: 30s
  timeout: 5s
  start_period: 10s
  retries: 3

services:
  a301-prod-redis:
    command:
      - redis-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - *redis-password
    environment:
      # redis-cli가 읽는 비밀번호(헬스체크)
      REDISCLI_AUTH: *redis-password

  a301-prod-be:
    environment:
      SPRING_DATA_REDIS_PASSWORD: *redis-password

  a301-prod-ai-agent:
    environment:
      REDIS_PASSWORD: *redis-password

  a301-prod-ai-analysis:
    environment:
      REDIS_PASSWORD: *redis-password
    healthcheck: *ai-worker-healthcheck

  a301-prod-ai-plan:
    environment:
      REDIS_PASSWORD: *redis-password
    healthcheck: *ai-worker-healthcheck

  a301-prod-ai-recording:
    environment:
      REDIS_PASSWORD: *redis-password
    healthcheck: *ai-worker-healthcheck

  a301-prod-livekit:
    environment:
      REDIS_PASSWORD: *redis-password

  a301-prod-egress:
    # 설정 본문은 키 하나라 통째로 바꾼다. compose.yml과 같고 redis.password만 더했다
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        api_key: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY CI/CD variable is required}
        api_secret: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET CI/CD variable is required}
        ws_url: ws://a301-prod-livekit:7880
        redis:
          address: a301-prod-redis:6379
          password: ${REDIS_PASSWORD:?REDIS_PASSWORD CI/CD variable is required}
        health_port: 8080
        prometheus_port: 9090
        cpu_cost:
          track_cpu_cost: 0.1

  a301-prod-redis-exporter:
    environment:
      REDIS_PASSWORD: *redis-password
