# 운영 서버 Nginx 설정(a301-prod-nginx). /etc/nginx/nginx.conf 전체를 이 파일로 바꾼다(443을 나누는 stream 블록이 http 밖에 있어야 하기 때문).
# 경로 규칙은 개발 서버 deploy/dev/nginx.conf.example과 같다(목 서버 경로만 없음).
#
# 바깥에서 들어오는 길(배포 계획 5.1 · 5.2)
# - TCP 443 (서버 443 → 컨테이너 443, stream): TLS 첫 메시지의 도메인 이름(SNI)을 보고 나눈다. TLS는 여기서 풀지 않는다.
#     hangguet.co.kr · rtc.hangguet.co.kr · grafana.hangguet.co.kr → 아래 HTTPS 서버(컨테이너 8443)
#     그 밖(turn.hangguet.co.kr 등)                               → LiveKit TURN/TLS(a301-prod-livekit:443)
#   왜: TURN/TLS는 SSAFY 와이파이처럼 바깥 TCP를 443만 허용하는 곳용이라 443을 비울 수 없고, 웹도 443이 필요하다.
#       이름을 모르는 접속을 TURN으로 보내는 것은, 브라우저는 웹에 늘 SNI를 보내지만 TURN 쪽은 SNI가 빠져도 면접방이 붙게 하려고다.
# - TCP 80 (서버 80 → 컨테이너 8080): https로 보낸다(예전 Cloudflare "Always Use HTTPS"가 하던 일).
# - 컨테이너 80: Cloudflare Tunnel(cloudflared)이 넘겨 주는 입구. DNS를 서버 IP로 바꾸는 동안만 쓴다. 서버 포트에 연결하지 않는다.
#
# 앱 경로(hangguet.co.kr)
# - /be/    → a301-prod-be:8080     BE. /be를 떼고 넘긴다. 관리 페이지가 /be/api/v1을 부른다.
#                                     Swagger(/be/docs 등)는 운영에서 공개하지 않는다(BE에서도 꺼 둠, compose.yml)
# - /admin/ → a301-prod-admin:80    관리 페이지 정적 파일
# - /       → a301-prod-fe:3000     FE
# Nginx는 가장 길게 맞는 접두사를 고르므로 /be/·/admin/이 /보다 먼저 잡힌다.
# AI(a301-prod-ai)는 내부 전용이라 여기에 없다.
#
# TLS는 이 Nginx(8443)에서 끝나고 뒤쪽 서비스로는 HTTP로 넘긴다. 그래서 원래 요청이 https였다고 X-Forwarded-* 헤더로 알려 준다.
# - BE: forward-headers-strategy: framework라 이 헤더로 Swagger "Try it out" 주소를 만든다.
# - FE: 서버 액션은 요청의 Origin과 Host(X-Forwarded-Host)가 같은지 확인하므로 Host를 그대로 넘겨야 한다.
#
# 인증서: 서버의 certbot(Cloudflare DNS 플러그인, DNS-01)이 /etc/letsencrypt/live/hangguet.co.kr/에 받고(도메인 3개),
# 갱신되면 /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh가 reload한다(배포 계획 4.2).

worker_processes auto;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

stream {
    # 주소를 변수로 두고 Docker 내장 DNS로 찾는다(아래 http와 같은 이유: LiveKit이 꺼져 있어도 Nginx가 뜨게)
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $ssl_preread_server_name $tls_route {
        hangguet.co.kr          127.0.0.1:8443;
        rtc.hangguet.co.kr      127.0.0.1:8443;
        grafana.hangguet.co.kr  127.0.0.1:8443;
        default                 127.0.0.1:10443;
    }

    # 바깥 443. 사용자 IP를 PROXY protocol로 붙여 넘긴다(HTTPS 서버가 이 값으로 사용자 IP를 안다).
    server {
        listen 443;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $tls_route;
    }

    # TURN/TLS로 가는 중간 단계. LiveKit TURN은 PROXY protocol을 모르므로 여기서 떼고 넘긴다(루프백 전용)
    server {
        listen 127.0.0.1:10443 proxy_protocol;
        set $livekit_turn a301-prod-livekit:443;
        proxy_pass $livekit_turn;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # 사용자 IP. 직접 접속(8443)은 stream이 붙인 PROXY protocol 값, Tunnel 입구(80)는 Cloudflare가 붙인 헤더를 쓴다.
    # 80은 서버 포트에 연결하지 않아 cloudflared(같은 Docker 네트워크)만 닿으므로 헤더를 믿어도 된다.
    map $proxy_protocol_addr $client_ip {
        ""      $http_cf_connecting_ip;
        default $proxy_protocol_addr;
    }
    # 직접 접속은 stream(127.0.0.1)을 거쳐 오므로, 로그 · 오류 기록의 $remote_addr도 PROXY protocol 값(사용자 IP)으로 바꾼다
    set_real_ip_from 127.0.0.1;
    real_ip_header   proxy_protocol;

    # 요청 수 제한(사용자 IP당, 배포 계획 5.2). 넘으면 429로 답한다.
    # 로그인 · 회원가입은 FE 페이지(/login · /signup)로 오는 POST(서버 액션)이고 FE가 BE를 부르므로, BE가 아니라 여기서 IP로 센다.
    # 수치는 SSAFY 캠퍼스처럼 여러 사람이 공인 IP 하나를 같이 쓰는 곳을 기준으로 넉넉히 잡았다(시연 때 수십 명이 함께 로그인 · 면접).
    # - login: 로그인 · 회원가입 · 관리자 로그인. 초당 1회, 한꺼번에 30회까지. 비밀번호 대입을 초당 수천 회에서 1회로 묶는다
    # - write: 그 밖의 POST(서버 액션: 면접 상태 확인 2초마다 · 답변 제출 등). 초당 30회, 한꺼번에 60회까지
    # - be: /be/ 전체(관리 페이지 API). 초당 30회, 한꺼번에 60회까지
    # GET(화면 · 정적 파일)은 세지 않는다. 키가 비면 세지 않으므로 POST만 IP를 키로 준다.
    map $request_method $post_client_ip {
        POST    $client_ip;
        default "";
    }
    limit_req_zone $post_client_ip zone=login:10m rate=60r/m;
    limit_req_zone $post_client_ip zone=write:10m rate=30r/s;
    limit_req_zone $client_ip      zone=be:10m    rate=30r/s;
    limit_req_status    429;
    limit_req_log_level warn;

    # WebSocket(LiveKit 시그널링 · Grafana Live)을 넘길 때 Upgrade 요청이면 Connection: upgrade를 붙인다
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # 기본 이미지 형식과 같고, 마지막 칸만 사용자 IP다(예전에는 Cloudflare가 붙인 X-Forwarded-For)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$client_ip"';
    access_log /var/log/nginx/access.log main;

    # 주소를 변수로 두고 Docker 내장 DNS로 찾는다(결과는 10초 캐시 후 다시 조회).
    # proxy_pass에 이름을 바로 쓰면 Nginx가 시작할 때 한 번만 찾아서
    # - 컨테이너가 꺼져 있으면 Nginx가 아예 뜨지 않고
    # - 재배포로 컨테이너 IP가 바뀌면 reload 전까지 502가 난다
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/hangguet.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hangguet.co.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Nginx가 만드는 리다이렉트(/be → /be/ 등)를 상대 주소로 보낸다.
    # 절대 주소로 보내면 Tunnel 입구(80)로 받은 요청이 http://로 나가 https가 풀린다.
    absolute_redirect off;

    # 서버 80 → https. 우리 도메인만 보내고, IP나 모르는 이름으로 온 요청은 응답 없이 끊는다
    server {
        listen 8080 default_server;
        return 444;
    }
    server {
        listen 8080;
        server_name hangguet.co.kr rtc.hangguet.co.kr grafana.hangguet.co.kr;
        return 301 https://$host$request_uri;
    }

    # 앱. 직접 접속(8443)과 Tunnel 입구(80)를 같이 받는다
    server {
        listen 80 default_server;
        listen 8443 ssl proxy_protocol;
        http2 on;
        server_name hangguet.co.kr;

        set $be_upstream    http://a301-prod-be:8080;
        set $admin_upstream http://a301-prod-admin:80;
        set $fe_upstream    http://a301-prod-fe:3000;

        # 모든 경로가 같이 쓰는 헤더
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $client_ip;
        proxy_set_header X-Forwarded-For    $client_ip;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   443;

        # 컨테이너 상태 확인(compose healthcheck). 바깥 요청도 닿지만 내용이 없다.
        location = /nginx-health {
            access_log off;
            return 200 "OK";
        }

        location = /be {
            return 308 /be/$is_args$args;
        }

        # Swagger는 운영에서 공개하지 않는다. BE에서도 꺼 두었지만 경로도 막아 둔다(BE 설정이 빠져도 열리지 않게).
        location ~ ^/be/(docs|swagger-ui|v3/api-docs)(/|$) {
            return 404;
        }

        location /be/ {
            limit_req zone=be burst=60 nodelay;
            rewrite ^/be(/.*)$ $1 break;
            proxy_pass $be_upstream;
            # location 안에서 proxy_set_header를 하나라도 쓰면 위의 공통 헤더가 상속되지 않으므로 모두 다시 적는다.
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $client_ip;
            proxy_set_header X-Forwarded-For    $client_ip;
            proxy_set_header X-Forwarded-Proto  https;
            proxy_set_header X-Forwarded-Host   $host;
            proxy_set_header X-Forwarded-Port   443;
            # Swagger·리다이렉트 주소 앞에 /be를 붙이게 한다
            proxy_set_header X-Forwarded-Prefix /be;

            # 관리자 로그인은 로그인 제한을 더 건다(관리자는 몇 명뿐이라 한꺼번에 10회까지).
            # 안쪽 location은 rewrite · proxy_pass를 물려받지 않아 다시 적는다(proxy_set_header는 여기서 쓰지 않으므로 위 값을 물려받는다)
            location = /be/api/v1/admin/auth/login {
                limit_req zone=be burst=60 nodelay;
                limit_req zone=login burst=10 nodelay;
                rewrite ^/be(/.*)$ $1 break;
                proxy_pass $be_upstream;
            }
        }

        # 관리 페이지. 경로(/admin/)를 유지해 정적 파일 서버에 전달한다.
        location = /admin {
            return 308 /admin/$is_args$args;
        }

        location /admin/ {
            proxy_pass $admin_upstream;
        }

        # FE 지표 경로는 개발 서버에서만 쓴다. 공용 주소에는 노출하지 않는다.
        location = /api/monitoring/metrics {
            return 404;
        }

        # 로그인 · 회원가입 화면. 서버 액션(POST)이 이 경로로 온다
        location = /login {
            limit_req zone=login burst=30 nodelay;
            proxy_pass $fe_upstream;
        }
        location = /signup {
            limit_req zone=login burst=30 nodelay;
            proxy_pass $fe_upstream;
        }

        # FE (나머지 모든 경로). 접두사 없이 그대로 넘긴다.
        location / {
            limit_req zone=write burst=60 nodelay;
            proxy_pass $fe_upstream;
        }
    }

    # LiveKit 시그널링(wss://rtc.hangguet.co.kr). 미디어는 여기를 거치지 않고 서버 IP로 바로 간다(배포 계획 2장)
    # WebSocket이라 HTTP/2를 켜지 않는다(브라우저가 HTTP/1.1로 붙는다)
    server {
        listen 8443 ssl proxy_protocol;
        server_name rtc.hangguet.co.kr;

        set $livekit_upstream http://a301-prod-livekit:7880;

        location / {
            proxy_pass $livekit_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         $connection_upgrade;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $client_ip;
            proxy_set_header X-Forwarded-For    $client_ip;
            proxy_set_header X-Forwarded-Proto  https;
            # 면접 내내 열려 있는 연결이다. 기본값(60초)이면 조용한 순간에 끊길 수 있어 길게 둔다
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }
    }

    # 대시보드(Grafana 자체 로그인, 배포 계획 3.3). Grafana Live가 WebSocket을 쓴다
    server {
        listen 8443 ssl proxy_protocol;
        http2 on;
        server_name grafana.hangguet.co.kr;

        set $grafana_upstream http://a301-prod-grafana:3000;

        location / {
            proxy_pass $grafana_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         $connection_upgrade;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $client_ip;
            proxy_set_header X-Forwarded-For    $client_ip;
            proxy_set_header X-Forwarded-Proto  https;
        }
    }
}
