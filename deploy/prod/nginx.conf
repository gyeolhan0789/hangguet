# 운영 서버 Nginx 설정(a301-prod-nginx). /etc/nginx/nginx.conf 전체를 이 파일로 바꾼다(443을 나누는 stream 블록이 http 밖에 있어야 하기 때문).
# 경로 규칙은 개발 서버 deploy/dev/nginx.conf.example과 같다(목 서버 경로만 없음).
#
# 바깥에서 들어오는 길(배포 계획 5.1 · 5.2)
# - TCP 443 (서버 443 → 컨테이너 443, stream): TLS 첫 메시지의 도메인 이름(SNI)을 보고 나눈다. TLS는 여기서 풀지 않는다.
#     hangguet.co.kr · rtc.hangguet.co.kr · grafana.hangguet.co.kr → 아래 HTTPS 서버(컨테이너 루프백 8443)
#     그 밖(turn.hangguet.co.kr 등)                               → LiveKit TURN/TLS(a301-prod-livekit:443)
#   왜: TURN/TLS는 SSAFY 와이파이처럼 바깥 TCP를 443만 허용하는 곳용이라 443을 비울 수 없고, 웹도 443이 필요하다.
#       이름을 모르는 접속을 TURN으로 보내는 것은, 브라우저는 웹에 늘 SNI를 보내지만 TURN 쪽은 SNI가 빠져도 면접방이 붙게 하려고다.
# - TCP 80 (서버 80 → 컨테이너 8080): https로 보낸다(예전 Cloudflare "Always Use HTTPS"가 하던 일).
# - 컨테이너 127.0.0.1:80: 컨테이너 상태 확인(compose healthcheck) 전용. 컨테이너 안에서만 닿고 서버 포트에 연결하지 않는다.
#
# 앱 경로(hangguet.co.kr)
# - /be/    → a301-prod-be:8080     BE. /be를 떼고 넘긴다. 관리 페이지가 /be/api/v1을 부른다.
#                                     Swagger(/be/docs 등)는 운영에서 공개하지 않는다(BE에서도 꺼 둠, compose.yml)
# - /admin/ → a301-prod-admin:80    관리 페이지 정적 파일
# - /       → a301-prod-fe:3000     FE
# Nginx는 가장 길게 맞는 접두사를 고르므로 /be/·/admin/이 /보다 먼저 잡힌다.
# AI(a301-prod-ai)는 내부 전용이라 여기에 없다.
#
# TLS는 이 Nginx(8443)에서 끝나고 뒤쪽 서비스로는 HTTP로 넘긴다. 그래서 원래 요청이 https였다고 X-Forwarded-* 헤더로 알려 준다.
# - BE: forward-headers-strategy: framework라 이 헤더로 Swagger "Try it out" 주소를 만든다.
# - FE: 서버 액션은 요청의 Origin과 Host(X-Forwarded-Host)가 같은지 확인하므로 Host를 그대로 넘겨야 한다.
#
# 인증서: 서버의 certbot(Cloudflare DNS 플러그인, DNS-01)이 /etc/letsencrypt/live/hangguet.co.kr/에 받고(도메인 3개),
# 갱신되면 /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh가 reload한다(배포 계획 4.2).

worker_processes auto;
error_log /var/log/nginx/error.log notice;

# 연결 한도(배포 계획 5.2). 바깥 연결 하나가 Nginx 안에서 연결 4개를 쓴다(바깥 → 443 stream → 8443 HTTPS → FE · BE).
# TURN/TLS도 면접 내내 4개를 차지한다. 기본값(작업 프로세스당 1024)이면 4코어에서 바깥 연결 약 1000개가 서버 전체의 한계라 넉넉히 올린다.
# 파일 수 한도는 연결 수보다 크게 둔다. 컨테이너가 이 값을 허용하도록 compose.yml에 ulimits를 함께 둔다
worker_rlimit_nofile 16384;

events {
    worker_connections 4096;
}

stream {
    # 주소를 변수로 두고 Docker 내장 DNS로 찾는다(아래 http와 같은 이유: LiveKit이 꺼져 있어도 Nginx가 뜨게)
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $ssl_preread_server_name $tls_route {
        hangguet.co.kr          127.0.0.1:8443;
        rtc.hangguet.co.kr      127.0.0.1:8443;
        grafana.hangguet.co.kr  127.0.0.1:8443;
        default                 127.0.0.1:10443;
    }

    # 443 동시 연결 수 제한(사용자 IP당, 배포 계획 5.2). 한 IP가 연결을 수천 개 열어 자리를 다 차지하지 못하게 한다.
    # 웹 · 면접방 시그널링 · TURN/TLS를 모두 센다. 브라우저 하나는 5개 안팎(앱 HTTP/2 · 글꼴 · rtc WebSocket · TURN)이라
    # SSAFY처럼 공인 IP 하나를 쓰는 곳에서 약 200명까지 막히지 않게 1000개로 둔다. 넘으면 새 연결을 바로 끊는다
    limit_conn_zone $binary_remote_addr zone=stream_conn:10m;
    limit_conn_log_level warn;

    # 바깥 443. 사용자 IP를 PROXY protocol로 붙여 넘긴다(HTTPS 서버가 이 값으로 사용자 IP를 안다).
    server {
        listen 443;
        limit_conn stream_conn 1000;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $tls_route;
    }

    # TURN/TLS로 가는 중간 단계. LiveKit TURN은 PROXY protocol을 모르므로 여기서 떼고 넘긴다(루프백 전용)
    server {
        listen 127.0.0.1:10443 proxy_protocol;
        set $livekit_turn a301-prod-livekit:443;
        proxy_pass $livekit_turn;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # 사용자 IP. stream이 붙인 PROXY protocol 값만 쓴다.
    # 요청 헤더(CF-Connecting-IP · X-Forwarded-For 등)는 보내는 쪽이 지어낼 수 있어 믿지 않는다.
    # http 블록에서는 set을 쓸 수 없어 map으로 이름을 붙인다
    map $proxy_protocol_addr $client_ip {
        default $proxy_protocol_addr;
    }
    # 직접 접속은 stream(127.0.0.1)을 거쳐 오므로, 로그 · 오류 기록의 $remote_addr도 PROXY protocol 값(사용자 IP)으로 바꾼다
    set_real_ip_from 127.0.0.1;
    real_ip_header   proxy_protocol;

    # 요청 수 제한(사용자 IP당, 배포 계획 5.2). 넘으면 429로 답한다.
    # 로그인 · 회원가입은 FE 페이지(/login · /signup)로 오는 POST(서버 액션)이고 FE가 BE를 부르므로, BE가 아니라 여기서 IP로 센다.
    # 수치는 SSAFY 캠퍼스처럼 여러 사람이 공인 IP 하나를 같이 쓰는 곳을 기준으로 넉넉히 잡았다(시연 때 수십 명이 함께 로그인 · 면접).
    # - login: 로그인 · 회원가입 · 비밀번호 재설정 · 관리자 로그인. 초당 1회, 한꺼번에 30회까지. 비밀번호 대입을 초당 수천 회에서 1회로 묶는다
    # - password_reset: 비밀번호 찾기 메일 요청(/forgot-password · /be/api/v1/auth/password-reset). 분당 10회, 한꺼번에 10회까지.
    #   보내는 메일 수가 Gmail 하루 한도(약 500통)에 묶여 있어 다른 구역보다 좁게 잡았다. 같은 이메일은 BE가 30초에 한 번만 보낸다
    # - write: 그 밖의 POST(서버 액션: 면접 상태 확인 2초마다 · 답변 제출 등). 초당 30회, 한꺼번에 60회까지
    # - be: /be/ 전체(관리 페이지 API). 초당 30회, 한꺼번에 60회까지
    # login · write는 POST만 센다(화면 GET은 아래 page 구역). 키가 비면 세지 않으므로 POST만 IP를 키로 준다.
    map $request_method $post_client_ip {
        POST    $client_ip;
        default "";
    }
    limit_req_zone $post_client_ip zone=login:10m rate=60r/m;
    limit_req_zone $post_client_ip zone=password_reset:10m rate=10r/m;
    limit_req_zone $post_client_ip zone=write:10m rate=30r/s;
    limit_req_zone $client_ip      zone=be:10m    rate=30r/s;

    # page: 화면 GET(서버에서 그리는 Next 화면 · 링크 미리 불러오기). 초당 100회, 한꺼번에 200회까지.
    # 화면 하나가 FE · BE를 함께 쓰므로 새로고침 폭주를 막는다. 정적 파일(/_next/ · 이미지 · 글꼴 · 3D 모델 등)은 세지 않는다.
    # 링크 미리 불러오기가 화면마다 여러 번 나가고 공용 IP에서 여러 명이 함께 쓰므로 다른 구역보다 넉넉히 잡았다
    map $uri $is_static_file {
        ~^/_next/                                                                          1;
        ~*\.(js|css|map|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|glb|gltf|hdr|mp3|wav|ogg|mp4|webm|wasm|task|bin|json|txt|xml)$ 1;
        default                                                                            0;
    }
    map "$request_method:$is_static_file" $page_client_ip {
        "GET:0"  $client_ip;
        "HEAD:0" $client_ip;
        default  "";
    }
    limit_req_zone $page_client_ip zone=page:10m rate=100r/s;
    limit_req_status    429;
    limit_req_log_level warn;

    # 동시에 처리 중인 요청 수 제한(사용자 IP당). HTTP/2는 연결 하나에 요청 여러 개가 함께 오므로 연결이 아니라 요청을 센다.
    # 느린 요청을 잔뜩 걸어 FE · BE를 붙잡아 두는 것을 막는다. 서버에서 그리는 화면 · 서버 액션 · /be/ API만 센다(사용자 한 명이 동시에 1~3개).
    # 정적 파일(아래 page 구역의 판정)은 세지 않는다: 화면 하나가 수십 개를 함께 받고 3D 모델은 받는 동안 내내 자리를 차지해,
    # 공용 IP에서 여러 명이 화면을 열면 정적 파일이 429로 깨질 수 있다
    map $is_static_file $dynamic_client_ip {
        0       $client_ip;
        default "";
    }
    limit_conn_zone   $dynamic_client_ip zone=http_conn:10m;
    limit_conn_status 429;
    limit_conn_log_level warn;

    # WebSocket(LiveKit 시그널링 · Grafana Live)을 넘길 때 Upgrade 요청이면 Connection: upgrade를 붙인다
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # 기본 이미지 형식과 같고, 마지막 칸만 사용자 IP다(예전에는 Cloudflare가 붙인 X-Forwarded-For)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$client_ip"';
    access_log /var/log/nginx/access.log main;

    # 주소를 변수로 두고 Docker 내장 DNS로 찾는다(결과는 10초 캐시 후 다시 조회).
    # proxy_pass에 이름을 바로 쓰면 Nginx가 시작할 때 한 번만 찾아서
    # - 컨테이너가 꺼져 있으면 Nginx가 아예 뜨지 않고
    # - 재배포로 컨테이너 IP가 바뀌면 reload 전까지 502가 난다
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/hangguet.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hangguet.co.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Nginx가 만드는 리다이렉트(/be → /be/ 등)를 상대 주소로 보낸다.
    # 절대 주소로 보내면 Nginx가 듣는 컨테이너 포트(8443)가 주소에 붙는다.
    absolute_redirect off;

    # 서버 80 → https. 우리 도메인만 보내고, IP나 모르는 이름으로 온 요청은 응답 없이 끊는다
    server {
        listen 8080 default_server;
        return 444;
    }
    server {
        listen 8080;
        server_name hangguet.co.kr rtc.hangguet.co.kr grafana.hangguet.co.kr;
        return 301 https://$host$request_uri;
    }

    # 컨테이너 상태 확인(compose healthcheck) 전용. 컨테이너 안(루프백)에서만 닿는다
    server {
        listen 127.0.0.1:80;
        access_log off;

        location = /nginx-health {
            return 200 "OK";
        }
        location / {
            return 444;
        }
    }

    # HTTPS 서버(8443)는 루프백에만 연다. 위 stream(443)만 붙는 내부 포트다.
    # 왜: 모든 주소에 열면 같은 Docker 네트워크의 다른 컨테이너가 stream을 건너뛰고 붙어, PROXY protocol 헤더에
    #     아무 IP나 적어 사용자 IP($client_ip)를 지어낼 수 있다(IP당 요청 제한 회피 · 로그 오염)

    # 모르는 Host로 온 요청은 응답 없이 끊는다(서버 80의 8080과 같음).
    # 왜: stream은 TLS의 도메인 이름(SNI)만 보므로, SNI는 우리 도메인으로 맺고 Host 헤더만 다른 이름을 적은 요청이 여기까지 온다.
    #     기본 서버가 없으면 맨 앞의 앱 서버가 받아 그 Host를 FE · BE에 그대로 넘긴다
    server {
        listen 127.0.0.1:8443 ssl proxy_protocol default_server;
        return 444;
    }

    # 앱. stream(443)이 넘겨 준 직접 접속만 받는다
    server {
        listen 127.0.0.1:8443 ssl proxy_protocol;
        http2 on;
        server_name hangguet.co.kr;
        limit_conn http_conn 200;
        # 요청 본문 상한. 파일(프로필 사진 · 녹화 · 문의 첨부)은 브라우저가 S3로 바로 올리므로 큰 본문이 올 일이 없다.
        # Nginx 기본값 · Next 서버 액션 기본 상한과 같은 1MB를 명시해 둔다(넘으면 413)
        client_max_body_size 1m;

        set $be_upstream    http://a301-prod-be:8080;
        set $admin_upstream http://a301-prod-admin:80;
        set $fe_upstream    http://a301-prod-fe:3000;

        # 보안 헤더(배포 계획 5.2). 뒤쪽 서비스가 보내는 같은 헤더는 지우고 여기서 한 번만 붙인다.
        # 왜 지우나: BE(Spring Security)는 X-Frame-Options: DENY 등을 이미 보내, 두 값이 겹치면 브라우저가 헤더를 무시할 수 있다.
        # - HSTS: 1년 동안 브라우저가 이 도메인을 https로만 연다. 하위 도메인(includeSubDomains)과 preload는 넣지 않는다
        # - X-Frame-Options SAMEORIGIN: 다른 사이트가 우리 화면을 iframe에 넣지 못하게(클릭재킹)
        # - nosniff: 브라우저가 파일 종류를 추측하지 않게
        # - Referrer-Policy: 다른 사이트로 갈 때 주소의 경로 · 쿼리를 넘기지 않음
        # - X-Powered-By(Next.js · Spring): 쓰는 기술을 알리지 않음
        # location 안에서 add_header · proxy_hide_header를 쓰면 이 값들이 상속되지 않는다. 쓰게 되면 그 안에 다시 적는다
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # 모든 경로가 같이 쓰는 헤더
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $client_ip;
        proxy_set_header X-Forwarded-For    $client_ip;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   443;

        location = /be {
            return 308 /be/$is_args$args;
        }

        # 자동 스캐너가 찾는 경로는 앱까지 보내지 않고 응답 없이 끊는다(444). 우리가 쓰지 않는 경로만 넣는다.
        # - 점으로 시작하는 경로(/.env · /.git 등). /.well-known은 표준 경로라 뺀다
        # - 다른 서버 프로그램 경로(WordPress · phpMyAdmin · CGI 등)
        # - 우리가 쓰지 않는 서버 스크립트 · 설정 · 백업 확장자
        location ~* (^/\.(?!well-known/)|^/(wp-|wordpress|xmlrpc|phpmyadmin|pma|cgi-bin|vendor/phpunit|boaform|hnap1)|\.(php\d?|aspx?|jsp|cgi|env|sql|bak|old|swp|ini|log|ya?ml|conf)$) {
            access_log off;
            return 444;
        }

        # Swagger는 운영에서 공개하지 않는다. BE에서도 꺼 두었지만 경로도 막아 둔다(BE 설정이 빠져도 열리지 않게).
        location ~ ^/be/(docs|swagger-ui|v3/api-docs)(/|$) {
            return 404;
        }

        location /be/ {
            limit_req zone=be burst=60 nodelay;
            rewrite ^/be(/.*)$ $1 break;
            proxy_pass $be_upstream;
            # location 안에서 proxy_set_header를 하나라도 쓰면 위의 공통 헤더가 상속되지 않으므로 모두 다시 적는다.
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $client_ip;
            proxy_set_header X-Forwarded-For    $client_ip;
            proxy_set_header X-Forwarded-Proto  https;
            proxy_set_header X-Forwarded-Host   $host;
            proxy_set_header X-Forwarded-Port   443;
            # Swagger·리다이렉트 주소 앞에 /be를 붙이게 한다
            proxy_set_header X-Forwarded-Prefix /be;

            # 관리자 로그인은 로그인 제한을 더 건다(관리자는 몇 명뿐이라 한꺼번에 10회까지).
            # 안쪽 location은 rewrite · proxy_pass를 물려받지 않아 다시 적는다(proxy_set_header는 여기서 쓰지 않으므로 위 값을 물려받는다)
            location = /be/api/v1/admin/auth/login {
                limit_req zone=be burst=60 nodelay;
                limit_req zone=login burst=10 nodelay;
                rewrite ^/be(/.*)$ $1 break;
                proxy_pass $be_upstream;
            }

            # 회원 인증 API는 FE 서버 액션이 내부망으로 부르지만, /be/로도 열려 있어 바로 부르는 요청에 같은 제한을 건다
            location ~ ^/be/api/v1/auth/(login|password-reset/confirm)$ {
                limit_req zone=be burst=60 nodelay;
                limit_req zone=login burst=30 nodelay;
                rewrite ^/be(/.*)$ $1 break;
                proxy_pass $be_upstream;
            }
            location = /be/api/v1/auth/password-reset {
                limit_req zone=be burst=60 nodelay;
                limit_req zone=password_reset burst=10 nodelay;
                rewrite ^/be(/.*)$ $1 break;
                proxy_pass $be_upstream;
            }
        }

        # 관리 페이지. 경로(/admin/)를 유지해 정적 파일 서버에 전달한다.
        location = /admin {
            return 308 /admin/$is_args$args;
        }

        location /admin/ {
            proxy_pass $admin_upstream;
        }

        # FE 지표 경로는 개발 서버에서만 쓴다. 공용 주소에는 노출하지 않는다.
        location = /api/monitoring/metrics {
            return 404;
        }

        # 로그인 · 회원가입 화면. 서버 액션(POST)이 이 경로로 온다
        location = /login {
            limit_req zone=login burst=30 nodelay;
            limit_req zone=page burst=200 nodelay;
            proxy_pass $fe_upstream;
        }
        location = /signup {
            limit_req zone=login burst=30 nodelay;
            limit_req zone=page burst=200 nodelay;
            proxy_pass $fe_upstream;
        }
        # 비밀번호 찾기(메일 요청) · 재설정 화면. 서버 액션(POST)이 이 경로로 온다
        location = /forgot-password {
            limit_req zone=password_reset burst=10 nodelay;
            limit_req zone=page burst=200 nodelay;
            proxy_pass $fe_upstream;
        }
        location = /password-reset {
            limit_req zone=login burst=30 nodelay;
            limit_req zone=page burst=200 nodelay;
            proxy_pass $fe_upstream;
        }

        # FE (나머지 모든 경로). 접두사 없이 그대로 넘긴다.
        location / {
            limit_req zone=write burst=60 nodelay;
            limit_req zone=page burst=200 nodelay;
            proxy_pass $fe_upstream;
        }
    }

    # LiveKit 시그널링(wss://rtc.hangguet.co.kr). 미디어는 여기를 거치지 않고 서버 IP로 바로 간다(배포 계획 2장)
    # WebSocket이라 HTTP/2를 켜지 않는다(브라우저가 HTTP/1.1로 붙는다)
    server {
        listen 127.0.0.1:8443 ssl proxy_protocol;
        server_name rtc.hangguet.co.kr;

        set $livekit_upstream http://a301-prod-livekit:7880;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            proxy_pass $livekit_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         $connection_upgrade;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $client_ip;
            proxy_set_header X-Forwarded-For    $client_ip;
            proxy_set_header X-Forwarded-Proto  https;
            # 면접 내내 열려 있는 연결이다. 기본값(60초)이면 조용한 순간에 끊길 수 있어 길게 둔다
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }
    }

    # 대시보드(Grafana 자체 로그인, 배포 계획 3.3). Grafana Live가 WebSocket을 쓴다
    server {
        listen 127.0.0.1:8443 ssl proxy_protocol;
        http2 on;
        server_name grafana.hangguet.co.kr;

        set $grafana_upstream http://a301-prod-grafana:3000;
        # Grafana는 X-Frame-Options · nosniff를 스스로 보내므로 HSTS만 더한다
        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            proxy_pass $grafana_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         $connection_upgrade;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $client_ip;
            proxy_set_header X-Forwarded-For    $client_ip;
            proxy_set_header X-Forwarded-Proto  https;
        }
    }
}
