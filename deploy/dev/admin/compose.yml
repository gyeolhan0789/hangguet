# 관리 페이지는 앱 Compose와 별도로 실행한다. 공용 Nginx만 접근할 수 있다.
name: a301-dev-admin

services:
  a301-dev-admin:
    build:
      context: ../../../admin
    image: a301-dev-admin:${IMAGE_TAG:-local}
    container_name: a301-dev-admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    mem_limit: 64m
    networks:
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: server_public-network
