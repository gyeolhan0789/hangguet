# A301 개발 서버 전용 모니터링. 기존 deploy/dev/compose.yml과 별도 프로젝트로 실행한다.
# 먼저 앱 Compose가 a301-dev 네트워크를 만들어야 한다.
# Grafana만 미니PC의 Nginx가 사용하는 공용 Docker 네트워크에 연결한다.
# 로그: Alloy가 a301-dev-* 컨테이너 로그를 Loki에 모으고(3일 보관), Grafana "A301 개발 서버 로그" 대시보드로 본다.
name: a301-dev-monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  a301-dev-prometheus:
    image: prom/prometheus:v3.13.3
    container_name: a301-dev-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 384m
    cpus: "0.5"
    networks:
      - monitoring
      - app
    logging: *logging

  a301-dev-blackbox:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    container_name: a301-dev-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml:ro
    mem_limit: 64m
    cpus: "0.2"
    networks:
      - monitoring
      - app
    logging: *logging

  # 로그 저장소. 바깥이나 앱 네트워크에 열지 않고 Alloy · Grafana만 붙는다
  a301-dev-loki:
    image: grafana/loki:3.7.8
    container_name: a301-dev-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    mem_limit: 256m
    cpus: "0.5"
    networks:
      - monitoring
    logging: *logging

  # 로그 수집. Docker 소켓으로 a301-dev-* 컨테이너 로그만 읽는다(alloy.alloy).
  # Docker 소켓은 읽기 전용으로 붙이지만 API 호출 자체를 막지는 못하므로, 이 컨테이너는 공식 이미지 · 고정 버전만 쓴다.
  a301-dev-alloy:
    image: grafana/alloy:v1.20.1
    container_name: a301-dev-alloy
    restart: unless-stopped
    depends_on:
      - a301-dev-loki
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 어디까지 보냈는지 기억해, 재시작해도 같은 로그를 다시 보내지 않는다
      - alloy-data:/var/lib/alloy/data
    mem_limit: 128m
    cpus: "0.3"
    networks:
      - monitoring
    logging: *logging

  a301-dev-grafana:
    image: grafana/grafana:13.1.7
    container_name: a301-dev-grafana
    restart: unless-stopped
    depends_on:
      - a301-dev-prometheus
      - a301-dev-loki
    ports:
      - "127.0.0.1:${DEV_GRAFANA_HOST_PORT:-18090}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:18090/}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 384m
    cpus: "0.5"
    networks:
      - monitoring
      - proxy
    logging: *logging

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:

networks:
  monitoring:
  app:
    external: true
    name: a301-dev
  proxy:
    external: true
    name: server_public-network
