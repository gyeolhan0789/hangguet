# 개발 서버 로그 저장소(Loki). Alloy가 a301-dev-* 컨테이너 로그를 보내고 Grafana가 조회한다.
# 서버 한 대에서 혼자 도는 구성(단일 바이너리, 파일 저장)이다. 보관 기간이 지난 로그는 compactor가 지운다.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-10-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 개발 서버는 3일만 남긴다. 미니PC 디스크를 다른 프로젝트와 같이 쓰기 때문이다
  retention_period: 72h
  reject_old_samples: true
  reject_old_samples_max_age: 72h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
