<!--
  한끗 · S02-L 스트릭 레벨업 축하 데모
  흐름: 이전 구간 뱃지가 가운데 있음 → 왼쪽으로 슬쩍 이동하며 작아지고 흐려짐 → 새 구간 뱃지가 오른쪽에서 따라와 가운데 자리
        → 반짝! (뱃지 위로 사선 빛줄기가 지나감 + 살짝 커졌다 돌아옴 + 후광 확 퍼짐) → 종이폭죽 펑
        → LEVEL UP 칩 · 제목 · 설명 · 다음 단계 카드 · 계속하기 버튼이 차례로 뿅 (다음 단계 진행 바는 0에서 차오름)
  뒤 화면: pen.dev S02-L 목업과 같은 값 (배경 #0B0D14, 뱃지 148px, 이전 뱃지 72px · 투명도 45%)
  구간: 1일 불씨(회색 → 빨강) / 3일 활활 불꽃 / 6일 황금 불꽃 / 8일 푸른 불꽃 / 14일 전설의 불꽃(글래스) — 스트릭 뱃지 확정 색과 동일
  애니메이션: Motion (motion@12.4.7, 실서비스는 motion/react의 animate · useAnimate에 같은 값 사용)
  종이폭죽: Motion 파티클 70개 (네모 · 동그라미 · 별, 구간 색 3가지) — Lottie(Flex Confetti) 대신 Motion으로 교체, 외부 애니 파일 없음
-->

  el.style.background=t.glass
    ?"radial-gradient(ellipse 45% 35% at 30% 20%,#FFFFFFB3 0%,#FFFFFF00 100%),linear-gradient(-135deg,#C9B6FFE6 14.6%,#8FD3FFD9 50%,#FFB8E8E6 85.4%)"

    '<div class="shine-wrap"><div class="shine"></div></div>';
}

// 종이폭죽: Motion 파티클 — 물리 계산(초속도 + 중력 + 공기 저항)으로 궤적을 미리 뽑아 keyframes로 재생
// 뱃지에서 위·옆으로 펑 → 공기 저항에 금방 느려짐 → 종이처럼 좌우로 살랑이며 천천히 떨어지고 뒤집힘 → 마지막 1/3에서 사라짐
const rand=(a,b)=>a+Math.random()*(b-a);
const SHAPES=["rect","rect","rect","circle","star"];
function burst(t){
  const box=$("confetti"),pal=t.glass?["#C9B6FF","#8FD3FF","#FFB8E8"]:[t.light,t.to,"#FFFFFF"],runs=[];
  box.innerHTML="";
  for(let i=0;i<70;i++){
    const p=document.createElement("div"),shape=SHAPES[i%SHAPES.length],s=rand(9,16),w=shape==="rect"?s*.55:s;
    p.className="piece "+shape;Object.assign(p.style,{background:pal[i%pal.length],width:w+"px",height:s+"px",marginLeft:-w/2+"px",marginTop:-s/2+"px"});
    box.appendChild(p);
    const a=rand(0,Math.PI*2),v=rand(380,900),G=1100,K=rand(2.8,3.6),D=rand(2.2,3),dt=1/60;
    const P=1.3; // 터지는 세기 (퍼지는 거리 배율)
    let vx=Math.cos(a)*v*1.5*P,vy=(Math.sin(a)*v*.75-rand(250,500))*P,x=0,y=0;
    const sway=rand(16,36),freq=rand(3,6),ph=rand(0,6.3),spin=rand(-540,540),flip=rand(6,12);
    const xs=[],ys=[],rs=[],sy=[];
    for(let k=0;k*dt<=D;k++){
      const tt=k*dt;
      if(k%3===0){const fall=Math.min(1,Math.max(0,(tt-.3)/.6));
        xs.push(x+Math.sin(tt*freq+ph)*sway*fall);ys.push(y);rs.push(spin*tt);sy.push(shape==="circle"?1:Math.cos(tt*flip))}
      vy+=G*dt;vx-=vx*K*dt;vy-=vy*K*dt;x+=vx*dt;y+=vy*dt;
    }
    runs.push(animate(p,{x:xs,y:ys,rotate:rs,scaleY:sy,scale:[.4,1,1,1,1,1],opacity:[1,1,1,0]},{duration:D,ease:"linear"}));
  }
  Promise.all(runs).then(()=>{if(box.childElementCount===70)box.innerHTML=""});
}

// 주변 불씨: 각자 다른 박자로 반짝(밝기 · 크기) + 살짝씩 둥실 흔들림
function twinkle(els){els.forEach(e=>{
  loops.push(animate(e,{opacity:[1,.3,1],scale:[1,.7,1.6,1]},{duration:rand(1.2,2.6),delay:rand(0,1.2),repeat:Infinity,ease:"easeInOut"}));
  loops.push(animate(e,{x:[0,rand(-6,6),0],y:[0,rand(-10,-4),0]},{duration:rand(3,6),delay:rand(0,1),repeat:Infinity,ease:"easeInOut"}));
})}

// 배경 불씨 점 (목업 Gold Embers와 같은 분포)
const EMBERS=[[970,644,3],[510,677,5],[1103,259,6],[1070,206,5],[1095,108,3],[813,589,7],[594,455,3],[1046,335,6],[1184,753,7],[417,242,5],[972,495,5],[700,457,4],[961,428,6],[905,165,6],[948,459,4],[1183,66,4],[450,250,6],[782,825,4],[439,257,4],[526,113,6],[666,573,4],[1197,50,3],[452,758,7],[1000,847,7]];
EMBERS.forEach(([x,y,s])=>{const e=document.createElement("div");e.className="ember";Object.assign(e.style,{left:x+"px",top:y+"px",width:s+"px",height:s+"px"});$("embers").appendChild(e)});

function setup(){
  const t=T[level.day],p=T[level.prev],n=level.next&&T[level.next];
  paintBadge($("oldBadge"),p);paintBadge($("newBadge"),t);
  $("glow").style.background="radial-gradient(ellipse 50% 50% at 50% 50%,"+t.to+"59 0%,"+t.to+"00 100%)";
  document.querySelectorAll(".ember").forEach(e=>{e.style.background=t.light;e.style.boxShadow="0 0 8px 1px "+t.light});
  $("chip").style.background=t.to+"26";$("chip").style.color=t.light;$("trophy").setAttribute("fill",t.light);
  $("chipText").textContent="LEVEL UP · "+level.day+"일";
  $("title").textContent=t.name+" 달성!";
  $("sub").textContent=level.sub;
  if(n){$("nextL").textContent="다음 단계 · "+n.name;$("nextR").textContent=(level.next-level.day)+"일 남음";$("nextR").style.color=n.light;
    $("fill").style.background="linear-gradient(90deg,"+t.light+" 0%,"+n.light+" 100%)"}
  else{$("nextL").textContent="모든 단계 달성 · 2주 완주";$("nextR").textContent="14 / 14일";$("nextR").style.color=t.light;
    $("fill").style.background="linear-gradient(90deg,#C9B6FF 0%,#8FD3FF 50%,#FFB8E8 100%)"}
  // 시작 상태: 이전 뱃지만 가운데
  loops.forEach(l=>l.stop());loops=[];
  animate($("oldBadge"),{x:0,scale:1,opacity:1},{duration:0});
  animate($("newBadge"),{x:260,scale:.5,opacity:0},{duration:0});
  animate($("chev"),{opacity:0,x:-8},{duration:0});
  animate("#content > *",{opacity:0,y:24,scale:.7},{duration:0});
  animate($("glow"),{opacity:0,scale:.7},{duration:0});
  animate(".ember",{opacity:0,x:0,y:0,scale:1},{duration:0});
  animate($("fill"),{width:"0%"},{duration:0});
  $("confetti").innerHTML="";
}

const wait=s=>new Promise(r=>setTimeout(r,s*1000));
async function run(){
  if(busy)return;busy=true;setup();const token=++runId;
  const t=T[level.day],fillTo=level.next?"7%":"100%";
  st("① 이전 뱃지");await wait(.7);

  // ② 이전 뱃지는 왼쪽으로 슬쩍 + 작아지며 흐려짐, 새 뱃지가 오른쪽에서 따라와 가운데
  st("② 새 뱃지 등장");
  animate($("oldBadge"),{x:-194,scale:72/148,opacity:.45,boxShadow:"0 0 0px #00000000"},{duration:.6,ease:[.4,0,.2,1]});
  animate($("newBadge"),{x:0,scale:1,opacity:1},{type:"spring",stiffness:210,damping:20,delay:.12});
  animate($("chev"),{opacity:1,x:0},{duration:.3,delay:.45});
  await wait(.95);

  // ③ 반짝! 빛줄기 지나감 + 뱃지 콩 + 후광 확 + 종이폭죽 펑
  st("③ 반짝 · 펑");
  const shine=$("newBadge").querySelector(".shine-wrap");
  animate(shine,{x:[-160,180]},{duration:.55,ease:[.4,0,.2,1]});
  animate($("newBadge"),{scale:[1,1.14,1]},{duration:.5,ease:"easeOut"});
  animate($("glow"),{opacity:[0,1,.85],scale:[.7,1.25,1]},{duration:.9,ease:"easeOut"});
  animate(".ember",{opacity:[0,1]},{duration:.6,delay:stagger(.03,{from:"center"})});
  setTimeout(()=>{if(token===runId)twinkle([...document.querySelectorAll(".ember")])},1400);
  burst(t);
  await wait(.25);

  // ④ 아래 텍스트 차례로 뿅
  st("④ 안내 뿅");
  animate("#content > *",{opacity:1,y:0,scale:1},{type:"spring",bounce:.45,duration:.6,delay:stagger(.09)});
  await wait(.45);
  await animate($("fill"),{width:fillTo},{duration:.8,ease:[.2,.8,.2,1]});
  st("끝 · 계속하기 누르면 다시");busy=false;
}
$("go").onclick=run;$("cta").onclick=run;
sync();setup();
document.fonts.ready.then(()=>run());
</script>
