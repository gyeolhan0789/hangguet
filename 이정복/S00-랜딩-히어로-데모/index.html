<div class="below">↓ 다음 섹션 자리 (데모용 빈 공간 · 스크롤 효과 확인)</div>
<div class="replay"><button id="again">첫 등장 다시 보기</button><button id="bolt">번개 치기</button></div>
<script src="https://cdn.jsdelivr.net/npm/motion@12.4.7/dist/motion.js"></script>
<script>
const {animate,stagger,scroll}=Motion;
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const rand=(a,b)=>a+Math.random()*(b-a);

// 배경은 영역 밖으로 24px 크게 깔고 잘라서, 패럴랙스·숨쉬기·스크롤 확대 때 가장자리가 비지 않게 함
// 화면 너비에 맞춰 1440×900 히어로를 확대·축소
function fit(){const s=innerWidth/1440;$("heroScale").style.transform="scale("+s+")";$("heroWrap").style.height=900*s+"px"}
addEventListener("resize",fit);fit();

// ① 배경 면접관: 숨쉬기 + 마우스 패럴랙스
if(!reduce){
  animate($("bg"),{scale:[1,1.04,1]},{duration:8,repeat:Infinity,ease:"easeInOut"});
  addEventListener("mousemove",e=>{
    const nx=e.clientX/innerWidth*2-1,ny=e.clientY/innerHeight*2-1;
    animate($("bgPar"),{x:nx*12,y:ny*12,rotateY:nx*3},{type:"spring",stiffness:60,damping:20});
  });
}

// ② 번개: 4~7초마다 한 번, 배경 밝기도 같이
function bolt(){
  animate($("flash"),{opacity:[0,.7,0,.4,0]},{duration:.6,ease:"linear"});
  animate($("bg"),{filter:["brightness(1)","brightness(1.4)","brightness(1)"]},{duration:.6}).then(()=>$("bg").style.filter="none");
}
function boltLoop(){setTimeout(()=>{bolt();boltLoop()},rand(4000,7000))}
$("flash").style.opacity=0;
if(!reduce)boltLoop();
$("bolt").onclick=bolt;

// ③ 불씨: 아래에서 위로 올라가며 사라짐 + 좌우 흔들림
document.querySelectorAll("#embers > div").forEach(e=>{
  e.style.backgroundColor="#FFB27A";e.style.opacity=0;
  if(reduce)return;
  const d=rand(4,9),delay=rand(0,6);
  animate(e,{y:[0,-120],opacity:[0,1,0]},{duration:d,delay,repeat:Infinity,ease:"linear"});
  animate(e,{x:[0,20,0,-20,0]},{duration:d/2,delay,repeat:Infinity,ease:"easeInOut"});
});

// ④ 주황 글로우: 카피 뒤에서 천천히 숨쉬기
$("glow").style.backgroundImage="radial-gradient(ellipse 50% 50% at 50% 50%,#FF7A26 0%,#FF7A2600 100%)";
$("glow").style.opacity=.35;
if(!reduce)animate($("glow"),{scale:[1,1.15,1],opacity:[.35,.55,.35]},{duration:10,repeat:Infinity,ease:"easeInOut"});

// ⑤ 떠다니는 요소
if(!reduce)[["bubble",6,0],["chipStreak",5,.8],["chipGrowth",7,1.6]].forEach(([id,d,delay])=>
  animate($(id),{y:[0,-10,0]},{duration:d,delay,repeat:Infinity,ease:"easeInOut"}));
// 말풍선 글자 타자
const TEXT=$("bubbleText").textContent.trim();
$("bubbleText").innerHTML=[...TEXT].map(c=>"<span style=\"opacity:0\">"+(c===" "?"&nbsp;":c)+"</span>").join("");
function typeBubble(delay){
  const chars=$("bubbleText").querySelectorAll("span");
  animate(chars,{opacity:0},{duration:0});
  animate(chars,{opacity:1},{duration:.01,delay:stagger(.03,{startDelay:delay})});
}

// ⑥ 첫 등장: 헤드라인 줄 단위 → 0.4초 뒤 서브 카피 · CTA (끝나면 blur 지워서 글씨 선명하게)
const lines=[$("line1"),$("line2")],rest=[$("sub"),$("cta")];
function intro(){
  const from={y:24,opacity:0,filter:"blur(8px)"},to={y:0,opacity:1,filter:"blur(0px)"};
  [...lines,...rest].forEach(el=>animate(el,from,{duration:0}));
  const clear=els=>els.forEach(el=>el.style.filter="none");
  animate(lines,to,{duration:.7,ease:[.2,.8,.2,1],delay:stagger(.08)}).then(()=>clear(lines));
  animate(rest,to,{duration:.7,ease:[.2,.8,.2,1],delay:stagger(.08,{startDelay:.4})}).then(()=>clear(rest));
  typeBubble(.9);
}
intro();
$("again").onclick=()=>{scrollTo({top:0});intro()};

// ⑦ 스크롤: 배경은 커지며 어두워지고, 카피는 위로, 힌트는 사라짐
if(!reduce)animate($("hint"),{y:[0,6,0]},{duration:1.6,repeat:Infinity,ease:"easeInOut"});
function onScroll(){
  const h=$("heroWrap").offsetHeight,p=Math.min(1,Math.max(0,scrollY/h));
  $("bgZoom").style.transform="scale("+(1+.1*p)+")";
  $("bgScroll").style.opacity=1-.7*p;
  $("copy").style.transform="translateY("+(-80*p)+"px)";
  $("hint").style.opacity=scrollY>10?0:1;
}
$("hint").style.transition="opacity .3s";
addEventListener("scroll",onScroll,{passive:true});onScroll();
</script>
